# A one cell grid centers the mouse in its area, so an inset shifts that center by half the inset
# while a percent leaves it where it was. Those shifts are predictable without knowing where the
# window is. The screen mode is what proves the window was found at all: a window that is not falls
# back to the screen, which would satisfy every other check on its own.
#
# Each mode saves into a history of its own, which both names the measurement in the log and keeps
# the save from being skipped as a duplicate of another mode's.
idle-mode.to.window-mode=+t
idle-mode.to.left-mode=+y
idle-mode.to.top-mode=+i
idle-mode.to.half-mode=+u
idle-mode.to.screen-mode=+o

window-mode.overlay.area=active-window
window-mode.overlay.visible=false
window-mode.overlay.grid-cell-sizing=fit
window-mode.overlay.grid-max-row-count=1
window-mode.overlay.grid-max-column-count=1
window-mode.move-selection-to.grid-center=+space
window-mode.window-position-history.save-position=+s
window-mode.to.idle-mode=+esc

left-mode.overlay=window-mode.overlay
left-mode.overlay.area-left-inset=100
left-mode.move-selection-to.grid-center=+space
left-mode.left-position-history.save-position=+s
left-mode.to.idle-mode=+esc

top-mode.overlay=window-mode.overlay
top-mode.overlay.area-top-inset=80
top-mode.move-selection-to.grid-center=+space
top-mode.top-position-history.save-position=+s
top-mode.to.idle-mode=+esc

half-mode.overlay=window-mode.overlay
half-mode.overlay.area-width-percent=0.5
half-mode.overlay.area-height-percent=0.5
half-mode.move-selection-to.grid-center=+space
half-mode.half-position-history.save-position=+s
half-mode.to.idle-mode=+esc

screen-mode.overlay=window-mode.overlay
screen-mode.overlay.area=active-screen
screen-mode.move-selection-to.grid-center=+space
screen-mode.screen-position-history.save-position=+s
screen-mode.to.idle-mode=+esc
