# Which axis a wheel command fills, and with which sign. The vertical axis is what run-wheel.sh
# already checks by its effect on a window; the horizontal one cannot be checked that way, because
# no window reachable over ssh scrolls horizontally. The event tap reads the posted event instead,
# which is where the axis and the sign are decided.
idle-mode.to.wheel-mode=+t
wheel-mode.wheel.initial-velocity=800
wheel-mode.wheel.max-velocity=800
wheel-mode.wheel.acceleration=0
wheel-mode.start-wheel.down=+k
wheel-mode.stop-wheel.down=-k
wheel-mode.start-wheel.up=+i
wheel-mode.stop-wheel.up=-i
wheel-mode.start-wheel.right=+l
wheel-mode.stop-wheel.right=-l
wheel-mode.start-wheel.left=+j
wheel-mode.stop-wheel.left=-j
wheel-mode.to.idle-mode=+esc
