# Each scenario leaves hub-mode for its own mode and comes back on +z, so the ordered list of
# mode switches in the log is the pass/fail record: a missing sN-mode is a failed scenario.
virtual-keys=vk +startvk

key-alias.myalias=n m

idle-mode.to.hub-mode=+t
hub-mode.to.idle-mode=+esc

# 1 any-order move set: a and b pressed in either order.
hub-mode.to.s1-mode={+a +b}
s1-mode.to.hub-mode=+z

# 2 duration constraint: c held at least 150ms.
hub-mode.to.s2-mode=+c-150
s2-mode.to.hub-mode=+z

# 3 precondition, key must be pressed.
hub-mode.to.s3-mode=_{leftshift} +d
s3-mode.to.hub-mode=+z

# 4 precondition, key must be unpressed.
hub-mode.to.s4-mode=^{leftctrl} +e
s4-mode.to.hub-mode=+z

# 5 alternative combos.
hub-mode.to.s5-mode=+f | +g
s5-mode.to.hub-mode=+z

# 6 a macro presses a virtual key, and a combo gated on that virtual key then matches.
hub-mode.macro.setvk=+h -> #vk
hub-mode.to.s6-mode=_{vk} +i
s6-mode.to.hub-mode=+z

# 7 macro output: a wait then typed text. No mode change, so it is asserted on its own.
hub-mode.macro.waited=+j -> wait-150 'ok'

# 8 non-eating press still drives a mode switch.
hub-mode.to.s8-mode=#k
s8-mode.to.hub-mode=+z

# 9 alias: press any key of myalias.
hub-mode.to.s9-mode=+myalias
s9-mode.to.hub-mode=+z

# 10 sequential moves: o then p, and only in that order.
hub-mode.to.s10-mode=+o +p
s10-mode.to.hub-mode=+z

# 11 and 12 share a prefix, so the second move is what picks the branch.
hub-mode.to.s11-mode=+q +r
hub-mode.to.s12-mode=+q +s
s11-mode.to.hub-mode=+z
s12-mode.to.hub-mode=+z

# 13 and 14: a key held from before the mode switch still satisfies a precondition after it.
hub-mode.to.s13-mode=_{leftalt} +v
s13-mode.to.s14-mode=_{leftalt} +w
s14-mode.to.hub-mode=+z

# 15 min-max duration: released within 250ms of the press.
hub-mode.to.s15-mode=+l-0-250 -l
s15-mode.to.hub-mode=+z

# 16 duration on an any-order set: both presses within 200ms.
hub-mode.to.s16-mode={+x +y}-0-200
s16-mode.to.hub-mode=+z

# 17 plain wait: at least 200ms between the two presses.
hub-mode.to.s17-mode=+1 wait-200 +2
s17-mode.to.hub-mode=+z

# 18 and 19 ignore whatever is pressed in between, 19 also eats it.
hub-mode.to.s18-mode=+3 #{*}-0-500 +4
hub-mode.to.s19-mode=+5 +{*}-0-500 +6
s18-mode.to.hub-mode=+z
s19-mode.to.hub-mode=+z

# 20 optional move: 7 is required, 8 is not.
hub-mode.to.s20-mode={+7 +8?}
s20-mode.to.hub-mode=+z

# 21 to 23 the ignore list forms. Each near miss below presses the one key the form does not ignore.
hub-mode.to.s21-mode=+9 #{u}-0-500 +0
hub-mode.to.s22-mode=+; #{+}-0-500 +'
hub-mode.to.s23-mode=+[ #!{u}-0-500 +]
s21-mode.to.hub-mode=+z
s22-mode.to.hub-mode=+z
s23-mode.to.hub-mode=+z

# 24 sequential and any-order combined, and 25 an optional release.
hub-mode.to.s24-mode=+/ {+. +=} -/
hub-mode.to.s25-mode={+tab -tab?}
s24-mode.to.hub-mode=+z
s25-mode.to.hub-mode=+z

# 26, 27 and 29 the eating counterparts of 21 to 23. The key ignored by each is different so
# the log says which form ate it.
hub-mode.to.s26-mode=+f1 +{u}-0-500 +f2
hub-mode.to.s27-mode=+f3 +{+}-0-500 +f4
hub-mode.to.s29-mode=+f7 +!{f11}-0-500 +f8
s26-mode.to.hub-mode=+z
s27-mode.to.hub-mode=+z
s29-mode.to.hub-mode=+z

# 28 and 32 ignore the release of their own first key, which is what the release-only form is
# for. The press is non-eating so that the eaten flag on the release is the form's own doing.
hub-mode.to.s28-mode=#f5 #{-}-0-500 +f6
hub-mode.to.s32-mode=#f9 +{-}-0-500 +f10
s28-mode.to.hub-mode=+z
s32-mode.to.hub-mode=+z

# 30 at least one of the expanded alias presses, 31 all of them optional.
key-alias.atleastonealias=uparrow downarrow
key-alias.optionalalias=leftarrow rightarrow
hub-mode.to.s30-mode={+*atleastonealias+}
hub-mode.to.s31-mode={+f12 +*optionalalias?}
s30-mode.to.hub-mode=+z
s31-mode.to.hub-mode=+z

# 33 to 37 the alias expansion forms, and 38 a plain tap move. Each form gets its own alias so
# that one form's keys cannot complete another's.
key-alias.seqalias=end pageup
key-alias.tapalias=pagedown insert
key-alias.anyorderalias=del enter
key-alias.onetapalias=numpad1 numpad2
key-alias.opttapalias=numpad3 numpad4
hub-mode.to.s33-mode=+*seqalias
hub-mode.to.s34-mode=*tapalias
hub-mode.to.s35-mode={*anyorderalias}
hub-mode.to.s36-mode={*onetapalias+}
hub-mode.to.s37-mode={+numpad5 *opttapalias?}
hub-mode.to.s38-mode=home
s33-mode.to.hub-mode=+z
s34-mode.to.hub-mode=+z
s35-mode.to.hub-mode=+z
s36-mode.to.hub-mode=+z
s37-mode.to.hub-mode=+z
s38-mode.to.hub-mode=+z

# 39 a negated press, in its own mode: in hub-mode it would match every other scenario's keys.
hub-mode.to.neg-mode=+numpad6
neg-mode.to.s39-mode=+!numpad7
s39-mode.to.hub-mode=+z

# 40 and 41 the remaining precondition forms.
hub-mode.to.s40-mode=_{none} +numpadadd
hub-mode.to.s41-mode=_{leftshift | leftctrl} +numpadsubtract
s40-mode.to.hub-mode=+z
s41-mode.to.hub-mode=+z

# 42 releasing the virtual key 6 pressed makes 6 stop matching. 43 a virtual key pressed from
# the start, declared with a + above.
hub-mode.macro.clearvk=+numpadmultiply -> ~vk
hub-mode.to.s43-mode=_{startvk} +numpaddivide
s43-mode.to.hub-mode=+z

# 44 a macro output goes to the combo watcher, so it completes 38's tap on its own. 45 the same
# through a positional remap: numpad8 becomes numpad0, which 45 taps.
key-alias.remapalias=numpad8 numpad9
hub-mode.macro.taphome=+numpaddecimal -> home
hub-mode.macro.remapped=+remapalias -> remapalias=numpad0 pause -> #remapalias ~remapalias
hub-mode.to.s45-mode=numpad0
s45-mode.to.hub-mode=+z

# 46 and 47 the mode history stack: 46 is pushed on the way in, so 47 can go back to whichever
# mode was there rather than naming one.
hub-mode.to.s46-mode=+minus
s46-mode.push-mode-to-history-stack=true
s46-mode.to.s47-mode=+backslash
s47-mode.to.previous-mode-from-history-stack=+underscore
s46-mode.to.hub-mode=+z
s47-mode.to.hub-mode=+z

# 48 the deprecated timeout, which needs no key at all.
hub-mode.to.s48-mode=+pipe
s48-mode.timeout.duration-millis=400
s48-mode.timeout.mode=hub-mode

# 49 the timeout only fires when the mouse is idle, so moving it holds the mode. 50 is reachable
# only from 49, which is how the drive tells "still there" from "timed out and came back".
hub-mode.to.s49-mode=+caret
s49-mode.timeout.duration-millis=400
s49-mode.timeout.mode=hub-mode
s49-mode.timeout.only-if-idle=true
s49-mode.mouse.initial-velocity=200
s49-mode.mouse.max-velocity=200
s49-mode.start-move.right=+plus
s49-mode.stop-move.right=-plus
s49-mode.to.s50-mode=+hash
s50-mode.to.hub-mode=+z

# 51 a wait with both bounds, which the near misses below come too soon and too late for.
hub-mode.to.s51-mode=+f13 wait-200-500 +f14
s51-mode.to.hub-mode=+z

# 52 to 56 the modifiers no other scenario presses, one mode each: a usage mapped to the wrong key
# reaches the wrong mode rather than none, which the exact sequence below catches either way.
hub-mode.to.s52-mode=_{leftwin} +f15
s52-mode.to.hub-mode=+z
hub-mode.to.s53-mode=_{rightctrl} +f16
s53-mode.to.hub-mode=+z
hub-mode.to.s54-mode=_{rightshift} +f17
s54-mode.to.hub-mode=+z
hub-mode.to.s55-mode=_{rightalt} +f18
s55-mode.to.hub-mode=+z
hub-mode.to.s56-mode=_{rightwin} +f19
s56-mode.to.hub-mode=+z
