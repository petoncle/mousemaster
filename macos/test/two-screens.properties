# Checks that need two screens, driven by run-two-screens.sh. place-mode puts the mouse at the
# center of a screen. Every other check reads a position back with a save into a history of its
# own, which logs "Saved position (x, y) to <name>-position-history". The colors are saturated so
# that a capture of each screen can find them: green box borders, yellow labels, a magenta
# indicator at the mouse, a cyan layer at a saved position, and a blue line between the two.

idle-mode.to.normal-mode=+n

# A constant velocity with no acceleration and no coast: a held key moves the mouse the velocity
# times the screen scale times how long the key was held.
_move-mode.mouse.initial-velocity=1000
_move-mode.mouse.max-velocity=1000
_move-mode.mouse.acceleration=0
_move-mode.mouse.deceleration=0
_move-mode.start-move.up=+i
_move-mode.stop-move.up=-i
_move-mode.start-move.down=+k
_move-mode.stop-move.down=-k
_move-mode.start-move.left=+j
_move-mode.stop-move.left=-j
_move-mode.start-move.right=+l
_move-mode.stop-move.right=-l

normal-mode=_move-mode
normal-mode.save.s1-position-history=+f1
normal-mode.save.s2-position-history=+f2
normal-mode.save.s3-position-history=+f3
normal-mode.save.s4-position-history=+f4
normal-mode.save.s5-position-history=+f5
normal-mode.save.s6-position-history=+f6
normal-mode.save.s7-position-history=+f7
normal-mode.save.s8-position-history=+f8
normal-mode.save.s9-position-history=+f9
normal-mode.save.pin-position-history=+w
normal-mode.cycle-next.pin-position-history=+c
normal-mode.save.onex-position-history=_{100%} +x
normal-mode.save.twox-position-history=_{200%} +z
normal-mode.to.place-mode=+p
normal-mode.to.geometry-mode=+g
normal-mode.to.active-mode=+y
normal-mode.to.odd-mode=+o
normal-mode.to.filter-mode=+q
normal-mode.to.target-mode=+r
normal-mode.to.follow-mode=+f
normal-mode.to.pin-hint-mode=+h
normal-mode.to.ui-mode=+u
normal-mode.to.window-mode=+e
normal-mode.to.show-mode=+v

_style-mode.overlay.selection-keys=a b c d e f g h i j k l m n o p q r s t u v w x y z
_style-mode.overlay.box-opacity=0
_style-mode.overlay.box-border-thickness=2
_style-mode.overlay.box-border-color=#00FF00
_style-mode.overlay.box-border-opacity=1
_style-mode.overlay.font-size=30
_style-mode.overlay.font-color=#FFFF00
_style-mode.overlay.font-shadow-opacity=0
_style-mode.to.normal-mode=+esc

# One hint at the center of each screen.
place-mode=_style-mode
place-mode.overlay.area=all-screens
place-mode.overlay.grid-cell-sizing=fit
place-mode.overlay.grid-max-row-count=1
place-mode.overlay.grid-max-column-count=1
place-mode.overlay.selection-keys=a b

# A 2 by 2 grid on each screen: a hint lands on the center of a quadrant of its screen.
geometry-mode=_style-mode
geometry-mode.overlay.area=all-screens
geometry-mode.overlay.grid-cell-sizing=fit
geometry-mode.overlay.grid-max-row-count=2
geometry-mode.overlay.grid-max-column-count=2
geometry-mode.overlay.selection-keys=a b c d e f g h

# A 2 by 2 grid on the screen with the mouse.
active-mode=_style-mode
active-mode.overlay.area=active-screen
active-mode.overlay.grid-cell-sizing=fit
active-mode.overlay.grid-max-row-count=2
active-mode.overlay.grid-max-column-count=2
active-mode.overlay.selection-keys=a b c d

# A 3 by 3 grid on each screen: on a 2x screen, its cell centers fall on odd pixels.
odd-mode=_style-mode
odd-mode.overlay.area=all-screens
odd-mode.overlay.grid-cell-sizing=fit
odd-mode.overlay.grid-max-row-count=3
odd-mode.overlay.grid-max-column-count=3

# One row of 2 hints, or 4 on a 200% screen.
filter-mode=_style-mode
filter-mode.overlay.area=active-screen
filter-mode.overlay.grid-cell-sizing=fit
filter-mode.overlay.grid-max-row-count=1
filter-mode.overlay.grid-max-column-count=2 | _{200%} -> 4

# The target moves on its own, and move-to.target brings the mouse to it.
target-mode.overlay.mouse-follows-target=false
target-mode.overlay.visible=false
target-mode.target.initial-velocity=1000
target-mode.target.max-velocity=1000
target-mode.target.acceleration=0
target-mode.target.deceleration=0
target-mode.start-move-target.up=+i
target-mode.stop-move-target.up=-i
target-mode.start-move-target.down=+k
target-mode.stop-move-target.down=-k
target-mode.start-move-target.left=+j
target-mode.stop-move-target.left=-j
target-mode.start-move-target.right=+l
target-mode.stop-move-target.right=-l
target-mode.save.t1-position-history=+f1
target-mode.save.t2-position-history=+f2
target-mode.move-to.target=+m
target-mode.to.normal-mode=+esc

# A 2 by 2 grid half the size of the active screen that follows the mouse.
follow-mode=_style-mode _move-mode
follow-mode.overlay.area=active-screen
follow-mode.overlay.area-center=mouse
follow-mode.overlay.area-width-percent=0.5
follow-mode.overlay.area-height-percent=0.5
follow-mode.overlay.grid-cell-sizing=fit
follow-mode.overlay.grid-max-row-count=2
follow-mode.overlay.grid-max-column-count=2
follow-mode.overlay.selection-keys=a b c d
follow-mode.save.f1-position-history=+f1

pin-hint-mode=_style-mode
pin-hint-mode.overlay.type=pin-position-history

ui-mode=_style-mode
ui-mode.overlay.type=ui-accessibility
ui-mode.overlay.area=active-window

# The center of the active window.
window-mode.overlay.area=active-window
window-mode.overlay.visible=false
window-mode.overlay.grid-cell-sizing=fit
window-mode.overlay.grid-max-row-count=1
window-mode.overlay.grid-max-column-count=1
window-mode.move-to.overlay-center=+m
window-mode.save.win-position-history=+f1
window-mode.to.normal-mode=+esc

# A magenta square at the mouse, a cyan square at each saved pin, and a blue line from each pin to
# the mouse.
show-mode=normal-mode
show-mode.indicator.shape=rectangle
show-mode.indicator.size=40
show-mode.indicator.fill-color=#FF00FF
show-mode.indicator.fill-opacity=1
show-mode.indicator.stroke-opacity=0
show-mode.pin-indicator.shape=rectangle
show-mode.pin-indicator.position=pin-position-history
show-mode.pin-indicator.size=40
show-mode.pin-indicator.fill-color=#00FFFF
show-mode.pin-indicator.fill-opacity=1
show-mode.pin-indicator.stroke-opacity=0
show-mode.line-indicator.shape=line
show-mode.line-indicator.position=pin-position-history
show-mode.line-indicator.end-position=mouse
show-mode.line-indicator.stroke-thickness=6
show-mode.line-indicator.stroke-color=#0000FF
show-mode.to.normal-mode=+esc
