# The grid centered on the active window puts the cursor over whatever should scroll, since a
# scroll event goes to the window under the cursor rather than to the focused one.
idle-mode.to.wheel-mode=+t
wheel-mode.overlay.area=active-window
wheel-mode.overlay.visible=false
wheel-mode.overlay.grid-cell-sizing=fit
wheel-mode.overlay.grid-max-row-count=1
wheel-mode.overlay.grid-max-column-count=1
wheel-mode.move-target-to.grid-center=+space
wheel-mode.wheel.initial-velocity=800
wheel-mode.wheel.max-velocity=800
wheel-mode.wheel.acceleration=0
wheel-mode.start-wheel.down=+k
wheel-mode.stop-wheel.down=-k
wheel-mode.start-wheel.up=+i
wheel-mode.stop-wheel.up=-i
wheel-mode.to.idle-mode=+esc
