# default-combo-move-duration-millis is global, so it cannot go in combo-suite.properties without
# retiming every combo there. Both combos below rely on the default rather than a suffix: the first
# must complete inside the window, the second must not.
default-combo-move-duration-millis=0-250

idle-mode.to.hub-mode=+t
hub-mode.to.idle-mode=+esc

hub-mode.to.fast-mode=+a +b
fast-mode.to.hub-mode=+z
