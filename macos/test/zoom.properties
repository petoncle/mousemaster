# A zoom that is held for long enough to capture many frames. The capture has to happen off the
# main thread: from it, the screen capture proxy deadlocks after a few frames.
idle-mode.to.zoom-mode=+t
zoom-mode.zoom.percent=3.0
zoom-mode.zoom.center=mouse
zoom-mode.to.after-mode=+y
after-mode.to.idle-mode=+esc
