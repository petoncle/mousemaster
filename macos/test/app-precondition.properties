# Two modes reached by the same key, told apart only by which application is frontmost. The
# quotes are what lets an executable name hold a space, which macOS is full of.
app-alias.finderapp=Finder
app-alias.settingsapp="System Settings"
idle-mode.to.finder-mode=_{finderapp} +t
idle-mode.to.settings-mode=_{settingsapp} +t
finder-mode.to.idle-mode=+esc
settings-mode.to.idle-mode=+esc
