# Shrinking halves the grid in one direction, so the center of the grid after each step is
# arithmetic the test can predict. The three centers are saved as they are reached and read back at
# the end, because leaving grid-mode to read one back would reset the grid.
idle-mode.to.grid-mode=+t
idle-mode.to.hist-mode=+h
grid-mode.overlay.area=active-screen
grid-mode.overlay.visible=false
grid-mode.overlay.grid-cell-sizing=fit
grid-mode.overlay.grid-max-row-count=2
grid-mode.overlay.grid-max-column-count=2
grid-mode.move-target-to.grid-center=+space
grid-mode.shrink-grid.up=+i
grid-mode.shrink-grid.left=+j
grid-mode.snap-target.left=+n
grid-mode.snap-target.up=+u
grid-mode.move-grid.right=+p
grid-mode.position-history.save-position=+s
grid-mode.position-history.cycle-next=+w
grid-mode.probe-position-history.save-position=+x
grid-mode.to.idle-mode=+esc

hist-mode.overlay.type=position-history
hist-mode.overlay.selection-keys=a b c d
hist-mode.to.idle-mode=+esc
