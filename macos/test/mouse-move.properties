# A constant velocity with no acceleration and no coast, so the distance the cursor travels is the
# velocity times how long the key was held. center-mode is a one cell grid, which puts the cursor on
# the center of the active screen and leaves room to move in any direction; hist-mode reads the
# position back, since selecting a saved position logs it.
position-history.max-size=1

idle-mode.to.center-mode=+y
center-mode.hint.type=grid
center-mode.hint.grid-area=active-screen
center-mode.hint.grid-cell-sizing=fit
center-mode.hint.grid-max-row-count=1
center-mode.hint.grid-max-column-count=1
center-mode.hint.selection-keys=a b
center-mode.to.idle-mode=+esc

# The indicator is on so that drawing it is covered: it is the only thing that reads the cursor
# image, which a native image needs a registration for and reports as an error rather than a wrong
# position. Nothing here asserts on it, the run failing on the error is the check.
move-mode.indicator.enabled=true
move-mode.indicator.idle.color=#FF0000

idle-mode.to.move-mode=+t
move-mode.mouse.initial-velocity=400
move-mode.mouse.max-velocity=400
move-mode.mouse.acceleration=0
move-mode.mouse.deceleration=0
move-mode.start-move.up=+i
move-mode.stop-move.up=-i
move-mode.start-move.down=+k
move-mode.stop-move.down=-k
move-mode.start-move.left=+j
move-mode.stop-move.left=-j
move-mode.start-move.right=+l
move-mode.stop-move.right=-l
move-mode.position-history.save-position=+s
move-mode.to.hist-mode=+h
move-mode.to.idle-mode=+esc

hist-mode.hint.type=position-history
hist-mode.hint.selection-keys=a b
hist-mode.to.idle-mode=+esc
