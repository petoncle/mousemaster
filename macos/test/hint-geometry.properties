# A 2 by 2 grid of hints over a known area, so every hint's position is arithmetic the test can
# predict: selecting one logs where the mouse was moved to. all-mode covers every screen at once,
# which is what pins down screen enumeration and the direction of the y axis; active-mode then
# reads back which screen the cursor actually ended up on.
idle-mode.to.all-mode=+t
all-mode.overlay.grid-area=all-screens
all-mode.overlay.grid-cell-sizing=fit
all-mode.overlay.grid-max-row-count=2
all-mode.overlay.grid-max-column-count=2
all-mode.overlay.selection-keys=a b c d e f g h
all-mode.to.idle-mode=+esc

idle-mode.to.active-mode=+y
active-mode.overlay.grid-area=active-screen
active-mode.overlay.grid-cell-sizing=fit
active-mode.overlay.grid-max-row-count=2
active-mode.overlay.grid-max-column-count=2
active-mode.overlay.selection-keys=a b c d
active-mode.to.idle-mode=+esc
