# The two areas a ui hint can be looked for in: everything on the active screen, which walks every
# window front to back, and the active window alone.
idle-mode.to.screen-mode=+t
screen-mode.overlay.type=ui
screen-mode.overlay.ui-area=active-screen
screen-mode.overlay.selection-keys=a b c d e f g h i j k l m n o p
screen-mode.to.idle-mode=+esc

idle-mode.to.window-mode=+y
window-mode.overlay.type=ui
window-mode.overlay.ui-area=active-window
window-mode.overlay.selection-keys=a b c d e f g h i j k l m n o p
window-mode.to.idle-mode=+esc
