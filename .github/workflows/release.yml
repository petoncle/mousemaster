name: release
on:
  push:
    tags:
      - '*'
      - '!nightly'   # the rolling nightly tag is handled by nightly.yml
permissions:
  contents: write
jobs:
  build:
    uses: ./.github/workflows/build.yml
    secrets: inherit
  publish:
    name: Publish release
    needs: build
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Download executable
        uses: actions/download-artifact@v4
        with:
          name: mousemaster-exe
          path: target
      - name: Download app bundle
        uses: actions/download-artifact@v4
        with:
          name: mousemaster-macos
          path: target
      - name: Get commit message
        id: get_commit_message
        run: |
          $commitMessage = git log -1 --pretty=%B ${{ github.ref_name }}
          $releaseNotes += "### New features and improvements`n"
          $releaseNotes += ($commitMessage -split '\r?\n' | Select-Object -Skip 2) -join "`n"
          $releaseNotes += "`n"
          $releaseNotes += "### Installation on Windows`n"
          $releaseNotes += "1. Download **mousemaster.exe** (a portable executable).`n"
          $releaseNotes += "2. Download one of the existing configuration files:`n"
          $releaseNotes += "   - **neo-mousekeys-ijkl.properties** (***recommended***): an IJKL configuration ([see documentation](docs/neo-mousekeys-ijkl.md))`n"
          $releaseNotes += "   - **neru.properties**: a recursive hint configuration ([see documentation](docs/neru.md))`n"
          $releaseNotes += "   - **neo-mousekeys-wasd.properties**: a WASD configuration ([see documentation](docs/neo-mousekeys-wasd.md))`n"
          $releaseNotes += "   - **warpd.properties**: an HKJL configuration ([see documentation](docs/warpd.md))`n"
          $releaseNotes += "   - **mouseable.properties**: another HKJL configuration ([see documentation](docs/mouseable.md))`n"
          $releaseNotes += "   - **author.properties**: an IJKL configuration designed to control everything with the right hand only ([see documentation](docs/author.md))`n"
          $releaseNotes += "3. Place the executable and the configuration file in the same directory.`n"
          $releaseNotes += "4. Rename the configuration file to **mousemaster.properties**.`n"
          $releaseNotes += "5. Run **mousemaster.exe**: make sure to run it as administrator if you want the mousemaster overlay to be displayed on top of everything else.`n"
          $releaseNotes += "6. Feel free to open a [GitHub Issue](https://github.com/petoncle/mousemaster/issues) or join the [Discord](https://discord.gg/GSB6MaKb2R) if you need help creating your own configuration. If you have ideas for a better configuration that you would like to share, I'd love to hear from you.`n"
          $releaseNotes += "7. If you enjoy mousemaster, consider making a [donation](https://ko-fi.com/petoncle) or stop by the Discord to show your support!`n"
          $releaseNotes += "### Installation on macOS`n"
          $releaseNotes += "mousemaster reads the keyboard through the Karabiner virtual HID device, so that driver and a few permissions are needed.`n"
          $releaseNotes += "1. Install [Karabiner-Elements](https://karabiner-elements.pqrs.org), which installs the virtual HID device, and allow its system extension when macOS asks.`n"
          $releaseNotes += "2. Download and unzip **mousemaster-macos.zip**, then put **mousemaster.app** in **/Applications**.`n"
          $releaseNotes += "3. Download one of the configuration files above, place it in **/Applications** next to **mousemaster.app**, and rename it to **mousemaster.properties**.`n"
          $releaseNotes += "4. Run it from a terminal, as root, which the virtual HID device requires. The configuration is read from the working directory, so start it from where you put it: ``cd /Applications && sudo mousemaster.app/Contents/MacOS/mousemaster```n"
          $releaseNotes += "5. Grant the permissions macOS asks for, under **System Settings > Privacy & Security**, then quit and relaunch:`n"
          $releaseNotes += "   - **Input Monitoring**, to read the keys you press. Always needed.`n"
          $releaseNotes += "   - **Accessibility**, only for UI hints (``hint.type=ui``).`n"
          $releaseNotes += "   - **Screen Recording**, only for zoom (``mode.zoom``).`n"
          $releaseNotes += "### License`n"
          $releaseNotes += "mousemaster.exe and mousemaster.app embed Qt and QtJambi, used under the GNU Lesser General Public License. Run mousemaster with ``--licenses`` for the third-party notices and the full license texts.`n"
          Set-Content -Path ./release-notes.txt -Value $releaseNotes
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create ${{ github.ref_name }} "target/mousemaster.exe" "target/mousemaster-macos.zip" "configuration/author.properties" "configuration/mouseable.properties" "configuration/neo-mousekeys-ijkl.properties" "configuration/neo-mousekeys-wasd.properties" "configuration/neru.properties" "configuration/warpd.properties" --title "v${{ needs.build.outputs.version }}" --notes-file ./release-notes.txt
