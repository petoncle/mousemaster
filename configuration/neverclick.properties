<tr><td class=key>{moveonlykey}<td class=what>Move only, the arrows then scroll\
<tr><td class=key>{staykey}<td class=what>Leave the pointer where it clicks, or not\
<tr><td class=key>ctrl+{altheldctrlkey}<td class=what>Hold alt during the click\
