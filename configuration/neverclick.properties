<table cellspacing=0 cellpadding=0><tr><td valign=top><table cellspacing=0 cellpadding=0><tr><td class=icon align=center width=30>&#x29BF;</table><td class=gap><td>\
<table cellspacing=0 cellpadding=0><tr><td class=name>Mouse Action<tr><td class=about>Change what happens at the hint.</table></table>\
