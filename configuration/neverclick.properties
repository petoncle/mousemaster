_tool-mode.cheatsheet-indicator.font-name=Segoe UI | _{ismacos} -> Helvetica Neue
_tool-mode.cheatsheet-indicator.fill-color=#000000
_tool-mode.cheatsheet-indicator.fill-opacity=1
_tool-mode.cheatsheet-indicator.stroke-thickness=1
_tool-mode.cheatsheet-indicator.stroke-color=#FFFFFF
_tool-mode.cheatsheet-indicator.stroke-opacity=0.15
_tool-mode.cheatsheet-indicator.border-radius=12


# The keys that set what the tool does with a hint: its mouse action, the modifiers it holds,
# where the pointer ends, the drag, the picks. They work in the hints and in a refine.
_option-mode=_tool-mode
# The hotkeys re-arm the mouse action. The left click one bumps a left click to a
# double, then a triple, then back to a single click.
_option-mode.macro.armleft=_{ctrl isrightclick | ctrl ismiddleclick | ctrl istextselection | ctrl isdrag | ctrl ismoveonly} ^{alt shift} +toolkey \
    -> ~isrightclick ~ismiddleclick ~istextselection ~isdrag ~isdual ~isonepicked ~ismoveonly ~isdouble ~istriple
_option-mode.macro.armdouble=_{ctrl} ^{alt shift isrightclick ismiddleclick istextselection isdrag ismoveonly isdouble istriple} +toolkey -> #isdouble
_option-mode.macro.armtriple=_{ctrl isdouble} ^{alt shift} +toolkey -> ~isdouble #istriple
_option-mode.macro.armsingle=_{ctrl istriple} ^{alt shift} +toolkey -> ~istriple
_option-mode.macro.armctrlclick=_{alt} ^{ctrl shift} +toolkey \
    -> ~isrightclick ~ismiddleclick ~istextselection ~isdrag ~isdual ~isonepicked ~ismoveonly ~isdouble ~istriple #isctrlheld
_option-mode.macro.armright=_{ctrl shift} ^{alt} +toolkey \
    -> ~ismiddleclick ~istextselection ~isdrag ~isdual ~isonepicked ~ismoveonly ~isdouble ~istriple #isrightclick
_option-mode.macro.armmiddle=_{alt shift} ^{ctrl} +toolkey \
    -> ~isrightclick ~istextselection ~isdrag ~isdual ~isonepicked ~ismoveonly ~isdouble ~istriple #ismiddleclick
_option-mode.macro.armtextselection=_{ctrl alt} ^{shift} +toolkey \
    -> ~isrightclick ~ismiddleclick ~isdrag ~ismulti ~isonepicked ~ismoveonly ~isdouble ~istriple #isdual #istextselection
_option-mode.macro.armdrag=_{ctrl alt shift} +toolkey \
    -> ~isrightclick ~ismiddleclick ~istextselection ~ismulti ~isonepicked ~ismoveonly ~isdouble ~istriple #isdual #isdrag
# A tool armed over picks starts its picks over.
_option-mode.clear.pick-position-history=_{ctrl alt} ^{shift} +toolkey | _{ctrl alt shift} +toolkey
_option-mode.clear.drag-position-history=_{ctrl alt} ^{shift} +toolkey | _{ctrl alt shift} +toolkey
_option-mode.macro.moveonly=^{ismoveonly isdrag istextselection} +moveonlykey -> ~isdouble ~istriple #ismoveonly
_option-mode.macro.unmoveonly=_{ismoveonly} +moveonlykey -> ~ismoveonly
# Where the pointer ends up is kept for the next activations.
virtual-key.isstay=released
_option-mode.macro.stay=^{isstay} +staykey -> #isstay
_option-mode.macro.unstay=_{isstay} +staykey -> ~isstay
_option-mode.macro.slowdrag=_{isdrag} ^{isslowdrag} +slowdragkey -> #isslowdrag
_option-mode.macro.fastdrag=_{isdrag isslowdrag} +slowdragkey -> ~isslowdrag
# The drag path is kept for the next activations.
virtual-key.iseachtonext=released
_option-mode.macro.eachtonext=^{iseachtonext} _{isdrag ctrl} +eachtonextctrlkey -> #iseachtonext
_option-mode.macro.alltolast=_{isdrag iseachtonext ctrl} +eachtonextctrlkey -> ~iseachtonext
# The sticky hints hold no modifier.
_option-mode.macro.holdalt=^{isaltheld ctrl issticky isstickysave} +altheldkey \
    | ^{isaltheld issticky isstickysave} _{ctrl} +altheldctrlkey -> #isaltheld
_option-mode.macro.unholdalt=_{isaltheld} ^{ctrl} +altheldkey | _{isaltheld ctrl} +altheldctrlkey -> ~isaltheld
_option-mode.macro.holdctrl=^{isctrlheld ctrl issticky isstickysave} +ctrlheldkey \
    | ^{isctrlheld issticky isstickysave} _{ctrl} +ctrlheldctrlkey -> #isctrlheld
_option-mode.macro.unholdctrl=_{isctrlheld} ^{ctrl} +ctrlheldkey | _{isctrlheld ctrl} +ctrlheldctrlkey -> ~isctrlheld
_option-mode.macro.holdshift=^{isshiftheld ctrl shift issticky isstickysave} +shiftheldkey \
    | ^{isshiftheld issticky isstickysave} _{ctrl} +shiftheldctrlkey -> #isshiftheld
_option-mode.macro.unholdshift=_{isshiftheld} ^{ctrl shift} +shiftheldkey | _{isshiftheld ctrl} +shiftheldctrlkey -> ~isshiftheld

# Picks: Ctrl+D and ' pick two hints, Ctrl+M and Shift+' any number. Neither in a text
# selection, which picks two already, nor in the sticky hints.
_option-mode.macro.dual=^{isdual shift issticky isstickysave} +dualkey \
    | ^{isdual issticky isstickysave} _{ctrl} +dualctrlkey -> ~ismulti ~isonepicked #isdual
_option-mode.macro.undual=_{isdual} ^{shift istextselection isdrag} +dualkey | _{isdual ctrl} ^{istextselection isdrag} +dualctrlkey -> ~isdual ~isonepicked
_option-mode.macro.multi=^{ismulti istextselection issticky isstickysave} _{shift} +dualkey \
    | ^{ismulti istextselection issticky isstickysave} _{ctrl} +multictrlkey -> ~isdual ~isonepicked #ismulti
_option-mode.macro.unmulti=_{ismulti shift} ^{isdrag} +dualkey | _{ismulti ctrl} ^{isdrag} +multictrlkey -> ~ismulti
_option-mode.macro.unmultidrag=_{ismulti isdrag shift} +dualkey | _{ismulti isdrag ctrl} +multictrlkey -> ~ismulti #isdual
# = saves the hints picked next as sticky spots, until = again, or Enter in the hints, which
# shows them. From the sticky spots, the hints come back to pick more.
virtual-key.isstickysave=released
_option-mode.macro.stickysave=^{isstickysave} +stickysavekey -> ~issticky #isstickysave
_option-mode.macro.unstickysave=_{isstickysave} +stickysavekey -> ~isclairvoyance ~isgrid #issticky ~isstickysave


# The hints of the tool are one mode, whatever their source. The keys below swap the source of
# the hints and the field of vision without leaving them.
hint-mode=_option-mode
hint-mode.push-mode-to-history-stack=true
hint-mode.to.idle-mode=+exitkey | +backkey | _{isoverlayempty}
# The hints show at once, and fade out only when they are left.
hint-mode.overlay.fade-enabled=false | +exitkey -> true | +backkey -> true
hint-mode.overlay.selection-keys=hintkey
hint-mode.select=^{ctrl alt shift} +hintkey
hint-mode.deselect=+backkey
# A pick of a multi or dual select, or a sticky save, does not move the pointer.
hint-mode.overlay.mouse-follows-target=true | _{ismulti | isdual | isstickysave} -> false
# The hint typed runs the tool there, unless it is a pick or a refine.
# A pick is saved here, where the hint is still known, so the overlay can mark it; the pick
# modes bring the hints back.
hint-mode.toggle-save.pick-position-history=_{ismulti | isdual} ^{ctrl alt shift isrefine isstickysave} +hintkey
hint-mode.toggle-save.sticky-position-history=_{isstickysave} ^{ctrl alt shift isrefine} +hintkey
hint-mode.to.pick-mode=_{ismulti | isstickysave} ^{ctrl alt shift isrefine} +hintkey \
    | _{isdual} ^{ctrl alt shift isonepicked isrefine} +hintkey
hint-mode.to.second-pick-mode=_{isdual isonepicked} ^{ctrl alt shift isrefine} +hintkey
hint-mode.to.aim-mode=_{isrefine} ^{ctrl alt shift} +hintkey
# A refine from the center goes to an edge on its first arrow.
hint-mode.macro.centered=_{isrefine} ^{ctrl alt shift} +hintkey -> #iscentered
# Enter runs the tool on the picks, or where it ran last when nothing is picked. The pointer
# goes to the last pick first, so the run starts from the first one wherever a refine left it.
hint-mode.move-to.target=_{ismulti} ^{ctrl alt shift ispickpositionhistoryempty} +toolkey
hint-mode.to.click-all-mode=_{ismulti} ^{ctrl alt shift ispickpositionhistoryempty isdrag} +toolkey
# A multi select drag drops on its last pick.
hint-mode.unsave.drag-position-history=_{ismulti isdrag} ^{ctrl alt shift ispickpositionhistoryempty} +toolkey \
    | _{ctrl} +undoctrlkey
hint-mode.save.drop-position-history=_{ismulti isdrag} ^{ctrl alt shift ispickpositionhistoryempty} +toolkey
hint-mode.to.drag-mode=_{ismulti isdrag} ^{ctrl alt shift ispickpositionhistoryempty} +toolkey
hint-mode.cycle-next.last-position-history=_{ispickpositionhistoryempty} \
    ^{ctrl alt shift islastpositionhistoryempty ismulti isdual isstickysave} +toolkey
hint-mode.to.click-mode=^{ctrl alt shift ismulti isdual isstickysave isrefine} +hintkey \
    | _{ispickpositionhistoryempty} ^{ctrl alt shift islastpositionhistoryempty ismulti isdual isstickysave} +toolkey
hint-mode.to.refresh-mode=_{shift} +refreshkey
# Ctrl+Z forgets the last pick, and the target goes back to the pick before it.
hint-mode.unsave.pick-position-history=_{ctrl} +undoctrlkey
hint-mode.cycle-previous.pick-position-history=_{ctrl} +undoctrlkey
hint-mode.macro.undopick=_{ctrl} +undoctrlkey -> ~isonepicked

# Ctrl+T arms the refine for the hints typed next: each one waits on its target, which the
# target keys move, until Enter runs the tool there or picks it.
hint-mode.macro.refine=^{isrefine} _{ctrl} +refinectrlkey -> #isrefine
hint-mode.macro.unrefine=_{isrefine ctrl} +refinectrlkey -> ~isrefine
hint-mode.macro.endstickysave=_{isstickysave} ^{ctrl alt shift} +toolkey \
    -> ~isclairvoyance ~isgrid #issticky ~isstickysave
# Delete forgets the sticky spots, in the sticky hints.
hint-mode.clear.sticky-position-history=_{issticky | isstickysave} +resetkey

# The source of the hints. Each key switches to its source, or back to vision. The grid key
# goes back to the source the grid was shown over.
virtual-key.isgrid=released
hint-mode.macro.grid=^{isgrid} +gridkey -> #isgrid
hint-mode.macro.ungrid=_{isgrid} +gridkey | _{isgrid} +clairvoyancekey | _{isgrid} +narrowkey \
    | _{isgrid} +stickykey -> ~isgrid
virtual-key.isclairvoyance=released
virtual-key.issticky=released
virtual-key.isnarrow=released
virtual-key.isultranarrow=released
hint-mode.macro.clairvoyance=^{isclairvoyance} +clairvoyancekey -> ~issticky #isclairvoyance
hint-mode.macro.unclairvoyance=_{isclairvoyance} +clairvoyancekey -> ~isclairvoyance
hint-mode.macro.sticky=^{issticky isstickypositionhistoryempty} +stickykey -> ~isclairvoyance #issticky
hint-mode.macro.stickyselection=^{issticky} _{isstickypositionhistoryempty} +stickykey -> ~isclairvoyance #isstickysave
hint-mode.macro.unsticky=_{issticky} +stickykey -> ~issticky
hint-mode.macro.narrow=^{isnarrow shift} +narrowkey -> ~isclairvoyance ~issticky ~isultranarrow #isnarrow
hint-mode.macro.unnarrow=_{isnarrow} ^{shift} +narrowkey -> ~isnarrow
hint-mode.macro.ultranarrow=_{shift} ^{isultranarrow} +narrowkey -> ~isclairvoyance ~issticky ~isnarrow #isultranarrow
hint-mode.macro.unultranarrow=_{shift isultranarrow} +narrowkey -> ~isultranarrow
hint-mode.overlay.type=ui-vision | _{isgrid} -> grid \
    | _{isclairvoyance} ^{isgrid} -> ui-accessibility \
    | _{issticky} ^{isgrid isstickypositionhistoryempty} -> sticky-position-history
# Without sticky spots, the sticky hints start with picking them.
hint-mode.macro.stickyselect=_{issticky isstickypositionhistoryempty} -> ~issticky #isstickysave
hint-mode.overlay.vision-density=6 | _{isnarrow} -> 7 | _{isultranarrow} -> 8
# The field of vision is kept for the next activations.
virtual-key.isfovwindow=released
virtual-key.isfovscreen=released
hint-mode.macro.fovwindow=+fovwindowkey | ^{isfovwindow isfovscreen} +fovtogglekey \
    | ^{isfovwindow isfovscreen} _{shift} +fovcyclekey -> ~isfovscreen #isfovwindow
hint-mode.macro.fovscreen=+fovscreenkey | _{isfovwindow shift} +fovcyclekey -> ~isfovwindow #isfovscreen
hint-mode.macro.fovall=+fovallkey | _{isfovwindow | isfovscreen} +fovtogglekey \
    | _{isfovscreen shift} +fovcyclekey -> ~isfovwindow ~isfovscreen
hint-mode.overlay.area=all-screens | _{isfovscreen} -> active-screen | _{isfovwindow} -> active-window \
    | _{isclairvoyance} -> active-window
# Center First: the shortest labels go to the middle of the screen.
hint-mode.overlay.ui-order=active-screen-center
# The grid: one letter per row, one per column, so every label has two.
hint-mode.overlay.grid-cell-sizing=fit
hint-mode.overlay.grid-max-row-count=20 | _{smallscreen} -> 15
hint-mode.overlay.grid-max-column-count=26 | _{smallscreen} -> 20
hint-mode.overlay.layout-row-count=1
hint-mode.overlay.layout-column-count=26
hint-mode.overlay.box-width-percent=1 | _{isgrid} -> 0
hint-mode.overlay.box-height-percent=1 | _{isgrid} -> 0

# The look: white letters in a filled pill with a thin white border, and the box of each
# element outlined in the color of its label.
hint-mode.overlay.font-name=Segoe UI | _{ismacos} -> Helvetica Neue
hint-mode.overlay.font-size=11
hint-mode.overlay.font-weight=demi-bold
hint-mode.overlay.font-color=#FFFFFF
# No glow around the letters: the default one blurs every label on its own.
hint-mode.overlay.font-shadow-opacity=0
hint-mode.overlay.font-spacing-percent=0
hint-mode.overlay.selected-font-opacity=0.5
# UltraNarrow dims every letter but the next one to type.
hint-mode.overlay.font-opacity=1 | _{isultranarrow} ^{isgrid isclairvoyance issticky} -> 0.5
hint-mode.overlay.focused-font-opacity=1
hint-mode.overlay.box-color=rainbowgradient
hint-mode.overlay.box-opacity=1
hint-mode.overlay.box-border-color=#FFFFFF
hint-mode.overlay.box-border-opacity=0.9
hint-mode.overlay.box-border-thickness=1
hint-mode.overlay.box-border-radius=4
hint-mode.overlay.box-horizontal-padding=4
hint-mode.overlay.box-vertical-padding=1
hint-mode.overlay.ui-element-box-border-color=perhintrainbowgradient
hint-mode.overlay.ui-element-box-border-opacity=1
hint-mode.overlay.ui-element-box-border-thickness=1
hint-mode.overlay.ui-element-box-border-radius=2
hint-mode.overlay.ui-element-box-horizontal-padding=1
hint-mode.overlay.ui-element-box-vertical-padding=1
# A picked hint is inverted, its element or cell is outlined, and a dashed line runs from each
# pick to the next, or, for a drag all to last, from each pick to the target the drag drops on.
# The outline stays when the grid replaces the hints, or the hints the grid. The outlines and the
# lines are drawn behind the overlay.
hint-mode.overlay.saved-hints=pick-position-history | _{isstickysave} -> sticky-position-history
hint-mode.overlay.saved-box-color=#FFFFFF
hint-mode.overlay.saved-box-border-color=perhintrainbowgradient
hint-mode.overlay.saved-font-color=perhintrainbowgradient
hint-mode.overlay.saved-font-opacity=1
hint-mode.pick-indicator.enabled=true
hint-mode.pick-indicator.shape=rectangle
hint-mode.pick-indicator.position=pick-position-history
hint-mode.pick-indicator.position-anchor=hint-cell-edge
hint-mode.pick-indicator.area-top-inset=-1
hint-mode.pick-indicator.area-bottom-inset=-1
hint-mode.pick-indicator.area-left-inset=-1
hint-mode.pick-indicator.area-right-inset=-1
hint-mode.pick-indicator.border-radius=2
hint-mode.pick-indicator.fill-opacity=0
hint-mode.pick-indicator.stroke-thickness=2
hint-mode.pick-indicator.stroke-color=perhintrainbowgradient
hint-mode.pick-indicator.z=-2
hint-mode.line-indicator.enabled=true
hint-mode.line-indicator.shape=line
hint-mode.line-indicator.position=pick-position-history
hint-mode.line-indicator.position-anchor=hint-cell-edge
hint-mode.line-indicator.end-position=pick-position-history | _{isdrag} ^{iseachtonext} -> target
hint-mode.line-indicator.end-position-anchor=hint-cell-edge
hint-mode.line-indicator.stroke-thickness=2
hint-mode.line-indicator.stroke-color=#FFFFFF
hint-mode.line-indicator.stroke-dash-length=6
hint-mode.line-indicator.stroke-dash-gap=4
hint-mode.line-indicator.z=-1
# Black shows in the gaps of the white dashes: the line is seen on light and dark windows.
hint-mode.line-casing-indicator.enabled=true
hint-mode.line-casing-indicator.shape=line
hint-mode.line-casing-indicator.position=pick-position-history
hint-mode.line-casing-indicator.position-anchor=hint-cell-edge
hint-mode.line-casing-indicator.end-position=pick-position-history | _{isdrag} ^{iseachtonext} -> target
hint-mode.line-casing-indicator.end-position-anchor=hint-cell-edge
hint-mode.line-casing-indicator.stroke-thickness=2
hint-mode.line-casing-indicator.stroke-color=#000000
hint-mode.line-casing-indicator.z=-2

virtual-key.iscentered=released
virtual-key.isrefine=released
virtual-key.issnapleft=released
virtual-key.issnapright=released
virtual-key.issnapup=released
virtual-key.issnapdown=released
virtual-key.issnapy=released
virtual-key.isx75=released
virtual-key.isx50=released
virtual-key.isx25=released
virtual-key.isy75=released
virtual-key.isy50=released
virtual-key.isy25=released


# A round trip through a mode without hints makes the next scan a new one.
refresh-mode=_tool-mode
refresh-mode.to.hint-mode=#{*}-0


# After a pick, the same hints come back. A drag goes through the picks, text selection from
# the left edge of its first word to the right edge of its last, unless it was refined.
pick-mode=_tool-mode
pick-mode.overlay=hint-mode.overlay
pick-mode.indicator=hint-mode.indicator
pick-mode.move-target-to.cell-left=_{istextselection} ^{isrefine} #{*}-0
pick-mode.toggle-save.drag-position-history=_{isdrag | istextselection} ^{isrefine} #{*}-20
pick-mode.macro.onepicked=_{isdual} #{*}-20 -> #isonepicked
pick-mode.macro.picked=#{*}-40 -> ~iscentered
pick-mode.to.hint-mode=#{*}-40

# The second pick of a dual select runs the tool.
second-pick-mode=_tool-mode
second-pick-mode.overlay=hint-mode.overlay
second-pick-mode.indicator=hint-mode.indicator
second-pick-mode.move-target-to.cell-right=_{istextselection} ^{isrefine} #{*}-0
second-pick-mode.save.drop-position-history=_{isdrag | istextselection} ^{isrefine} #{*}-20
second-pick-mode.to.drag-mode=_{isdrag | istextselection} #{*}-40
second-pick-mode.move-to.target=^{isdrag istextselection} #{*}-30
second-pick-mode.to.click-all-mode=^{isdrag istextselection} #{*}-40

# A refined pick is saved where the refine left the target, with no hint: it can be far from
# it. The pick modes then go on as after any pick.
moved-pick-mode=_tool-mode
moved-pick-mode.overlay=hint-mode.overlay
moved-pick-mode.indicator=hint-mode.indicator
# The hints come back with the keys before the last one of the hint typed, for a neighbor
# after a Backspace. The pick is done here: they come back with none, as after any pick.
moved-pick-mode.deselect-all=#{*}-0
# After a refine, the target is where it left the pointer: a mode that stops following the
# pointer takes it as its target.
moved-pick-mode.save.pick-position-history=_{ismulti | isdual} #{*}-10
moved-pick-mode.save.sticky-position-history=_{isstickysave} #{*}-10
moved-pick-mode.save.drag-position-history=_{isdrag | istextselection} ^{isonepicked} #{*}-10
moved-pick-mode.save.drop-position-history=_{isdrag isonepicked | istextselection isonepicked} #{*}-10
moved-pick-mode.to.pick-mode=_{ismulti | isstickysave} #{*}-20 | _{isdual} ^{isonepicked} #{*}-20
moved-pick-mode.to.second-pick-mode=_{isdual isonepicked} #{*}-20

# A refine of a pick canceled with Backspace leaves the target on the last pick, for Ctrl+Z.
canceled-pick-mode=_tool-mode
canceled-pick-mode.overlay=hint-mode.overlay
canceled-pick-mode.indicator=hint-mode.indicator
canceled-pick-mode.cycle-previous.pick-position-history=#{*}-0
canceled-pick-mode.cycle-next.pick-position-history=#{*}-10
canceled-pick-mode.to.hint-mode=#{*}-20


# A refine moves the target of a hint typed after Ctrl+T, then Enter runs the tool there or
# picks it. The snap modes lay cells over the element and go to the edges asked for,
# anchor-mode lays a 2px cell on the pointer, and step-mode lays a 4px one where the last
# cell was and moves it by its own size: the pointer follows its center, 4px at a time. Ctrl
# held swaps in a 2px cell. Every cell is cut from the element, which keeps the element for
# the digits and the outline.
_refine-mode=_option-mode
_refine-mode.overlay.area=last-selected-hint-cell
_refine-mode.overlay.grid-cell-sizing=fit
_refine-mode.overlay.grid-max-row-count=1
_refine-mode.overlay.grid-max-column-count=1
_refine-mode.overlay.box-opacity=0
_refine-mode.overlay.box-border-opacity=0
_refine-mode.overlay.transition-enabled=false
_refine-mode.overlay.fade-enabled=false
_refine-mode.overlay.mouse-follows-target=true
_refine-mode.to.click-mode=^{ctrl alt shift ismulti isdual isstickysave} +toolkey
_refine-mode.to.moved-pick-mode=_{ismulti | isdual | isstickysave} ^{ctrl alt shift} +toolkey
_refine-mode.to.previous-mode-from-history-stack=^{ismulti isdual isstickysave} +backkey
_refine-mode.to.canceled-pick-mode=_{ismulti | isdual | isstickysave} +backkey
_refine-mode.macro.cancel=+backkey -> ~iscentered
# A digit snaps the target across the element, Shift and a digit down it, the numpad to one of
# its nine points. From the center, an arrow goes to that edge first.
_refine-mode.save.refine-position-history=+snapdigitkey | +numpadkey \
    | _{iscentered} +nudgeleftkey | _{iscentered} +nudgerightkey | _{iscentered} +nudgeupkey \
    | _{iscentered} +nudgedownkey
_refine-mode.to.center-x-mode=^{shift} +snapdigitkey | +numpadkey \
    | _{iscentered} +nudgeleftkey | _{iscentered} +nudgerightkey
_refine-mode.to.center-y-mode=_{shift} +snapdigitkey | _{iscentered} +nudgeupkey | _{iscentered} +nudgedownkey
_refine-mode.macro.snapleft=^{shift} +snapstartkey | +numpadleftkey | _{iscentered} +nudgeleftkey \
    -> ~iscentered #issnapleft
_refine-mode.macro.snapright=^{shift} +snapendkey | +numpadrightkey | _{iscentered} +nudgerightkey \
    -> ~iscentered #issnapright
_refine-mode.macro.snapup=_{shift} +snapstartkey | +numpadtopkey | _{iscentered} +nudgeupkey \
    -> ~iscentered #issnapup
_refine-mode.macro.snapdown=_{shift} +snapendkey | +numpadbottomkey | _{iscentered} +nudgedownkey \
    -> ~iscentered #issnapdown
_refine-mode.macro.snapx75=^{shift} +snap75key -> #isx75
_refine-mode.macro.snapx50=^{shift} +snap50key -> #isx50
_refine-mode.macro.snapx25=^{shift} +snap25key -> #isx25
_refine-mode.macro.snapy75=_{shift} +snap75key -> #isy75
_refine-mode.macro.snapy50=_{shift} +snap50key -> #isy50
_refine-mode.macro.snapy25=_{shift} +snap25key -> #isy25
_refine-mode.macro.snapnumpad=+numpadkey -> #issnapy
_refine-mode.macro.centered=+numpad5 -> #iscentered
# The element stays outlined, a line runs from its center to the target, and a dot marks it.
_refine-mode.element-indicator.enabled=true
_refine-mode.element-indicator.shape=rectangle
_refine-mode.element-indicator.area=last-selected-hint-cell
_refine-mode.element-indicator.area-top-inset=-0.5
_refine-mode.element-indicator.area-bottom-inset=-0.5
_refine-mode.element-indicator.area-left-inset=-0.5
_refine-mode.element-indicator.area-right-inset=-0.5
_refine-mode.element-indicator.border-radius=2
_refine-mode.element-indicator.fill-opacity=0
_refine-mode.element-indicator.stroke-color=last-selected-hint-box-color
_refine-mode.line-indicator.enabled=true
_refine-mode.line-indicator.shape=line
_refine-mode.line-indicator.position=last-selected-hint
_refine-mode.line-indicator.end-position=target
_refine-mode.line-indicator.stroke-color=last-selected-hint-box-color
_refine-mode.dot-indicator.enabled=true
_refine-mode.dot-indicator.z=1
_refine-mode.dot-indicator.position=target
_refine-mode.dot-indicator.size=8
_refine-mode.dot-indicator.fill-color=last-selected-hint-box-color
_refine-mode.dot-indicator.fill-opacity=1
_refine-mode.dot-indicator.stroke-thickness=1
_refine-mode.dot-indicator.stroke-color=#FFFFFF

# A snap moves the target without the pointer, one axis at a time: to the middle of the
# element along it, from either side, then to the edge of a cell scaled along it only, so the
# other axis stays. aim-mode then brings the pointer there once.
_snap-mode=_refine-mode
_snap-mode.overlay.mouse-follows-target=false
# The target goes through the middle of the element: the dot and the line stay where it was.
_snap-mode.dot-indicator.position=refine-position-history
_snap-mode.line-indicator.end-position=refine-position-history
center-x-mode=_snap-mode
center-x-mode.overlay.area-width-percent=0.00001
center-x-mode.move-target-to.cell-left=#{*}-0
center-x-mode.move-target-to.cell-right=#{*}-0
center-x-mode.to.snap-x-mode=_{issnapleft | issnapright} #{*}-20
center-x-mode.to.center-y-mode=_{issnapy} ^{issnapleft issnapright} #{*}-20
center-x-mode.to.aim-mode=^{issnapleft issnapright issnapy} #{*}-20
snap-x-mode=_snap-mode
snap-x-mode.overlay.area-width-percent=1 | _{isx75} -> 0.75 | _{isx50} -> 0.5 | _{isx25} -> 0.25
snap-x-mode.move-target-to.cell-left=_{issnapleft} #{*}-0
snap-x-mode.move-target-to.cell-right=_{issnapright} #{*}-0
snap-x-mode.to.center-y-mode=_{issnapy} #{*}-20
snap-x-mode.to.aim-mode=^{issnapy} #{*}-20
center-y-mode=_snap-mode
center-y-mode.overlay.area-height-percent=0.00001
center-y-mode.move-target-to.cell-top=#{*}-0
center-y-mode.move-target-to.cell-bottom=#{*}-0
center-y-mode.to.snap-y-mode=_{issnapup | issnapdown} #{*}-20
center-y-mode.to.aim-mode=^{issnapup issnapdown} #{*}-20
snap-y-mode=_snap-mode
snap-y-mode.overlay.area-height-percent=1 | _{isy75} -> 0.75 | _{isy50} -> 0.5 | _{isy25} -> 0.25
snap-y-mode.move-target-to.cell-top=_{issnapup} #{*}-0
snap-y-mode.move-target-to.cell-bottom=_{issnapdown} #{*}-0
snap-y-mode.to.aim-mode=#{*}-20
# The pointer goes to the target, where the refine goes on. A refine starts here, on the hint.
aim-mode=_refine-mode
aim-mode.overlay.mouse-follows-target=false
aim-mode.macro.aimed=#{*}-0 -> ~issnapleft ~issnapright ~issnapup ~issnapdown ~issnapy ~isx75 ~isx50 \
    ~isx25 ~isy75 ~isy50 ~isy25
aim-mode.move-to.target=#{*}-0
aim-mode.to.anchor-mode=#{*}-10

anchor-mode=_refine-mode
anchor-mode.overlay.area-center=mouse
anchor-mode.overlay.area-width-percent=0.00001
anchor-mode.overlay.area-height-percent=0.00001
anchor-mode.overlay.area-top-inset=-1
anchor-mode.overlay.area-bottom-inset=-1
anchor-mode.overlay.area-left-inset=-1
anchor-mode.overlay.area-right-inset=-1
anchor-mode.to.step-mode=#{*}-0

step-mode=_refine-mode
step-mode.overlay.area-center=last-overlay-area-center
step-mode.overlay.area-width-percent=0.00001
step-mode.overlay.area-height-percent=0.00001
step-mode.overlay.area-top-inset=-2
step-mode.overlay.area-bottom-inset=-2
step-mode.overlay.area-left-inset=-2
step-mode.overlay.area-right-inset=-2
step-mode.overlay.target-follows-overlay-center=true
step-mode.move-overlay-to.area-left=^{iscentered} +nudgeleftkey
step-mode.move-overlay-to.area-right=^{iscentered} +nudgerightkey
step-mode.move-overlay-to.area-above=^{iscentered} +nudgeupkey
step-mode.move-overlay-to.area-below=^{iscentered} +nudgedownkey
step-mode.to.fine-step-mode=+ctrl

fine-step-mode=step-mode
fine-step-mode.overlay.area-top-inset=-1
fine-step-mode.overlay.area-bottom-inset=-1
fine-step-mode.overlay.area-left-inset=-1
fine-step-mode.overlay.area-right-inset=-1
fine-step-mode.to.fine-step-mode=none
fine-step-mode.to.step-mode=-ctrl


# Running the tool. The click is a tap of a virtual key, so a macro can sequence it with the
# modifiers it holds, the return of the pointer and the exit.
virtual-key.click=released
virtual-key.goback=released
virtual-key.done=released
_run-mode=_tool-mode
# The picks keep their outlines and lines while the tool runs on them.
_run-mode.indicator=hint-mode.indicator
_run-mode.press.left=^{isrightclick ismiddleclick} +click
_run-mode.release.left=^{isrightclick ismiddleclick} -click
_run-mode.press.right=_{isrightclick} +click
_run-mode.release.right=_{isrightclick} -click
_run-mode.press.middle=_{ismiddleclick} +click
_run-mode.release.middle=_{ismiddleclick} -click
_run-mode.macro.holdctrl=_{isctrlheld} #{*}-0 -> +leftctrl
_run-mode.macro.holdshift=_{isshiftheld} #{*}-0 -> +leftshift
_run-mode.macro.holdalt=_{isaltheld} #{*}-0 -> +leftalt
_run-mode.macro.releasectrl=_{isctrlheld} +goback -> -leftctrl
_run-mode.macro.releaseshift=_{isshiftheld} +goback -> -leftshift
_run-mode.macro.releasealt=_{isaltheld} +goback -> -leftalt
_run-mode.cycle-next.origin-position-history=^{isstay} +goback
# The sticky hints stay open after a click.
_run-mode.to.idle-mode=^{issticky} +done
_run-mode.to.hint-mode=_{issticky} +done

# One, two or three clicks where the pointer is, which Enter can repeat. The sticky hints stay on
# screen during the click.
click-mode=_run-mode
click-mode.overlay=hint-mode.overlay
click-mode.overlay.enabled=false | _{issticky} -> true
click-mode.save.last-position-history=#{*}-0
click-mode.macro.click=^{isdouble istriple ismoveonly} #{*}-20 -> #click wait-40 ~click wait-80 goback done
click-mode.macro.doubleclick=_{isdouble} #{*}-20 \
    -> #click wait-40 ~click wait-60 #click wait-40 ~click wait-80 goback done
click-mode.macro.tripleclick=_{istriple} #{*}-20 \
    -> #click wait-40 ~click wait-60 #click wait-40 ~click wait-60 #click wait-40 ~click wait-80 goback done
click-mode.to.hover-mode=_{ismoveonly} #{*}-0

# A click on each pick, in the order they were picked.
click-all-mode=_run-mode
click-all-mode.cycle-next.pick-position-history=#{*}-0
click-all-mode.macro.click=#{*}-50 -> #click wait-40 ~click
click-all-mode.unsave.pick-position-history=#{*}-150
click-all-mode.to.click-all-mode=^{ispickpositionhistoryempty} #{*}-200
click-all-mode.macro.finish=_{ispickpositionhistoryempty} #{*}-250 -> goback done

# For each pick, a press, a glide to the drop point, or to the next pick with each to next, a
# release there. Only the glides are smooth: the pointer teleports to each pick and back to the
# origin. With each to next, the next pick grabs where the last one was dropped.
virtual-key.isdropped=released
drag-mode=_run-mode
drag-mode.mouse.smooth-jump-enabled=false | _{ismousepressing} -> true
drag-mode.mouse.smooth-jump-velocity=2500 | _{isslowdrag} -> 600
# The target is the pointer here, so the lines of a drag all to last end on the drop.
drag-mode.line-indicator.end-position=pick-position-history | _{isdrag} ^{iseachtonext} -> drop-position-history
drag-mode.line-casing-indicator.end-position=pick-position-history | _{isdrag} ^{iseachtonext} -> drop-position-history
# The glide starts once the press has made the jumps smooth.
drag-mode.cycle-next.drag-position-history=^{isdropped} #{*}-0 \
    | _{iseachtonext ismousepressing} ^{isdragpositionhistoryempty} #{*}-100
drag-mode.macro.press=#{*}-50 -> #click
# A drag bursts where it grabs and where it drops.
drag-mode.start.click-burst-animation=+isleftmousepressing | +ismiddlemousepressing | +isrightmousepressing \
    | -isleftmousepressing | -ismiddlemousepressing | -isrightmousepressing
drag-mode.unsave.drag-position-history=_{ismousepressing} #{*}-50
drag-mode.unsave.pick-position-history=_{ismousepressing} #{*}-50
drag-mode.cycle-next.drop-position-history=_{ismousepressing} ^{iseachtonext} #{*}-100 \
    | _{ismousepressing isdragpositionhistoryempty} #{*}-100
drag-mode.macro.release=_{ismousepressing} ^{ismoving} #{*}-250 -> ~click
drag-mode.macro.dropped=_{iseachtonext} -ismousepressing -> #isdropped
drag-mode.to.drag-mode=^{isdragpositionhistoryempty} -ismousepressing
drag-mode.macro.finish=_{isdragpositionhistoryempty} -ismousepressing -> wait-80 goback done


# After a move without a click, the arrows scroll under the pointer. Any other key leaves,
# and reaches the application: a hotkey opens the hints again from idle-mode.
hover-mode.mode-after-unhandled-key-press=idle-mode
hover-mode.to.idle-mode=+exitkey
hover-mode.wheel.initial-velocity=1000
hover-mode.wheel.max-velocity=2500
hover-mode.wheel.acceleration=800
hover-mode.start-wheel.up=+nudgeupkey
hover-mode.start-wheel.down=+nudgedownkey
hover-mode.start-wheel.left=+nudgeleftkey
hover-mode.start-wheel.right=+nudgerightkey
hover-mode.stop-wheel.up=-nudgeupkey
hover-mode.stop-wheel.down=-nudgedownkey
hover-mode.stop-wheel.left=-nudgeleftkey
hover-mode.stop-wheel.right=-nudgerightkey
hover-mode.indicator=_burst-mode.indicator
hover-mode.scroll-indicator.enabled=true
hover-mode.scroll-indicator.size=26
hover-mode.scroll-indicator.fill-color=last-selected-hint-box-color
hover-mode.scroll-indicator.fill-opacity=0.15
hover-mode.scroll-indicator.stroke-color=last-selected-hint-box-color
hover-mode.scroll-indicator.stroke-opacity=0.8 | _{iswheeling} -> 1
hover-mode.scroll-indicator.stroke-thickness=1 | _{iswheeling} -> 2
