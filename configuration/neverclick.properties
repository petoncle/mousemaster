
# Launch with <modifiers>+Enter: Ctrl=left click, Alt=ctrl-click, Ctrl+Shift=right click, Alt+Shift=middle click, Ctrl+Alt=text selection, Ctrl+Alt+Shift=drag, and Ctrl+\ opens the sticky hints. Hold ? for the keys.

# Hint keys in priority order: the first ones get the shortest labels.
key-alias.hintkey.us-qwerty=j f k d l s a v m e i c n o w r u g h t b y x q p z
key-alias.toolkey.us-qwerty=enter numpadenter
key-alias.ctrl=leftctrl rightctrl
key-alias.alt=leftalt rightalt
key-alias.shift=leftshift rightshift
key-alias.exitkey=esc
key-alias.backkey=backspace
# The hint source: ; a grid, [ accessibility hints on the active window, ] denser vision hints
# (Shift for the densest), \ the sticky spots.
key-alias.gridkey.us-qwerty=;
key-alias.clairvoyancekey.us-qwerty=[
key-alias.narrowkey.us-qwerty=]
key-alias.stickykey.us-qwerty=backslash
# Picks: Ctrl+D two hints then run, Ctrl+M any number then Enter (the older ' and Shift+' too),
# = saves the hints picked as sticky spots, Delete forgets them.
key-alias.dualkey.us-qwerty='
key-alias.dualctrlkey.us-qwerty=d
key-alias.multictrlkey.us-qwerty=m
key-alias.undoctrlkey.us-qwerty=z
key-alias.stickysavekey.us-qwerty==
key-alias.resetkey=del
# Modifiers held during the click: Ctrl+A Alt, Ctrl+C Ctrl, Ctrl+S Shift (the older , . / too).
key-alias.altheldkey.us-qwerty=,
key-alias.altheldctrlkey.us-qwerty=a
key-alias.ctrlheldkey.us-qwerty=.
key-alias.ctrlheldctrlkey.us-qwerty=c
key-alias.shiftheldkey.us-qwerty=/
key-alias.shiftheldctrlkey.us-qwerty=s
# Field of vision: the active window, its screen, every screen; Tab toggles window and all,
# Shift+F cycles the three.
key-alias.fovwindowkey=f1
key-alias.fovscreenkey=f2
key-alias.fovallkey=f3
key-alias.fovtogglekey=tab
key-alias.fovcyclekey.us-qwerty=f
key-alias.refreshkey.us-qwerty=r
# Moving the target, in a refine (Ctrl+T, then a hint): the arrows or Shift+IJKL, with Ctrl
# for 2px steps; 1 to 9 across the element in eighths, Shift+1 to 9 down it, the numpad to its
# nine points.
key-alias.refinectrlkey.us-qwerty=t
key-alias.nudgeupkey.us-qwerty=uparrow I
key-alias.nudgedownkey.us-qwerty=downarrow K
key-alias.nudgeleftkey.us-qwerty=leftarrow J
key-alias.nudgerightkey.us-qwerty=rightarrow L
key-alias.snapstartkey.us-qwerty=1 2 3 4
key-alias.snapcenterkey.us-qwerty=5
key-alias.snapendkey.us-qwerty=6 7 8 9
key-alias.snapdigitkey=snapstartkey snapcenterkey snapendkey
# 2 and 8 go to the edge of a cell 3/4 the size of the element, 3 and 7 of one half its size,
# 4 and 6 of one a quarter: an eighth, a quarter and three eighths in from the edge.
key-alias.snap75key.us-qwerty=2 8
key-alias.snap50key.us-qwerty=3 7
key-alias.snap25key.us-qwerty=4 6
key-alias.numpadkey=numpad1 numpad2 numpad3 numpad4 numpad5 numpad6 numpad7 numpad8 numpad9
key-alias.numpadleftkey=numpad7 numpad4 numpad1
key-alias.numpadrightkey=numpad9 numpad6 numpad3
key-alias.numpadtopkey=numpad7 numpad8 numpad9
key-alias.numpadbottomkey=numpad1 numpad2 numpad3
# 0 moves the pointer without clicking, - leaves it on the click instead of bringing it back,
# ` drags slowly, Ctrl+E drags each pick to the next one instead of all to the last.
key-alias.moveonlykey.us-qwerty=0
key-alias.staykey.us-qwerty=minus
key-alias.slowdragkey.us-qwerty=`
key-alias.eachtonextctrlkey.us-qwerty=e
key-alias.cheatsheetkey.us-qwerty=questionmark
# A tool keeps the keyboard: every key but Print Screen is eaten.
key-alias.eatenkey.us-qwerty=a b c d e f g h i j k l m n o p q r s t u v w x y z \
    1 2 3 4 5 6 7 8 9 0 ` minus = [ ] backslash ; ' , . / \
    space tab enter numpadenter backspace esc insert del home end pageup pagedown \
    uparrow downarrow leftarrow rightarrow capslock \
    f1 f2 f3 f4 f5 f6 f7 f8 f9 f10 f11 f12 \
    numpad0 numpad1 numpad2 numpad3 numpad4 numpad5 numpad6 numpad7 numpad8 numpad9 \
    numpadadd numpadsubtract numpadmultiply numpaddivide numpaddecimal \
    leftshift rightshift leftctrl rightctrl leftalt rightalt leftwin rightwin menu

screen-alias.largescreen= \
    3440x1440-100% \
    3840x1600-100% \
    3840x2160-100% \
    5120x1440-100% \
    6016x3384-200%
screen-alias.mediumscreen= \
    2560x1440-100% \
    2560x1600-100% \
    3840x2160-150% \
    4480x2520-200% \
    5120x2880-200%
screen-alias.smallscreen= \
    1366x768-100% \
    1920x1080-125% \
    1920x1080-150% \
    2880x1800-200% \
    2940x1912-200% \
    3024x1964-200% \
    3840x2160-300%

# A rainbow from the top of the screen to the bottom: it ramps through the hint boxes, and gives
# each element outline one color.
color-alias.rainbowgradient=across-screen per-pixel top-to-bottom #EF4444 #F97316 #EAB308 #84CC16 #22C55E #14B8A6 #06B6D4 #3B82F6 #8B5CF6 #D946EF
color-alias.perhintrainbowgradient=across-screen per-hint top-to-bottom #EF4444 #F97316 #EAB308 #84CC16 #22C55E #14B8A6 #06B6D4 #3B82F6 #8B5CF6 #D946EF

# Where the pointer was when the tool opened, where it clicked last, the hints picked, the
# points a drag grabs and the one it drops on, and the sticky spots.
origin-position-history.max-size=1
last-position-history.max-size=1
pick-position-history.max-size=100
drag-position-history.max-size=100
drop-position-history.max-size=1
sticky-position-history.max-size=26
# The target of a refine before a snap, shown while the snap runs.
refine-position-history.max-size=1


# The hotkeys arm the tool's mouse action, then open the hints. Pressing one again inside the hints
# re-arms without a new scan: the left click hotkey a second time arms a double click, a third
# time a triple click.
virtual-key.opentool=released
virtual-key.isrightclick=released
virtual-key.ismiddleclick=released
virtual-key.isdouble=released
virtual-key.istriple=released
virtual-key.istextselection=released
virtual-key.isdrag=released
# A dual select: two picks, then the tool runs.
virtual-key.isdual=released
virtual-key.isonepicked=released
virtual-key.ismulti=released
virtual-key.ismoveonly=released
virtual-key.isctrlheld=released
virtual-key.isshiftheld=released
virtual-key.isaltheld=released
virtual-key.isslowdrag=released
# The mouse action is armed once the hints are open, so they announce it.
idle-mode.macro.openleft=_{ctrl} ^{alt shift} +toolkey -> #opentool ~opentool
idle-mode.macro.openctrlclick=_{alt} ^{ctrl shift} +toolkey -> #opentool ~opentool #isctrlheld
idle-mode.macro.openright=_{ctrl shift} ^{alt} +toolkey -> #opentool ~opentool #isrightclick
idle-mode.macro.openmiddle=_{alt shift} ^{ctrl} +toolkey -> #opentool ~opentool #ismiddleclick
idle-mode.macro.opentextselection=_{ctrl alt} ^{shift} +toolkey -> #opentool ~opentool #isdual #istextselection
idle-mode.macro.opendrag=_{ctrl alt shift} +toolkey -> #opentool ~opentool #isdual #isdrag
idle-mode.macro.opensticky=_{ctrl} ^{alt shift} +stickykey -> #opentool ~opentool #issticky
idle-mode.to.hint-mode=+opentool
# The pointer comes back here after the click.
idle-mode.save.origin-position-history=+opentool
# The state of an activation is released once the tool is left, after the hints faded out in
# the colors they were showing.
idle-mode.macro.reset=#{*}-0 -> ~isrightclick ~ismiddleclick ~isdouble ~istriple ~istextselection ~isdrag \
    ~isdual ~isonepicked ~ismulti ~ismoveonly ~isctrlheld ~isshiftheld ~isaltheld ~isslowdrag \
    ~isrefine ~iscentered ~issnapleft ~issnapright ~issnapup ~issnapdown ~issnapy ~isx75 ~isx50 ~isx25 \
    ~isy75 ~isy50 ~isy25 ~isgrid ~isclairvoyance ~issticky ~isnarrow ~isultranarrow ~isstickysave ~isdropped
idle-mode.clear.pick-position-history=#{*}-0
idle-mode.clear.drag-position-history=#{*}-0
idle-mode.clear.drop-position-history=#{*}-0
idle-mode.stop-commands-from-previous-mode=true


# A click opens a disk in the color of the hint out into a thinning ring that fades away where
# the button went down. A button still held then shows the disk at the pointer, the cue that a
# drag is in progress.
click-burst-animation.duration-millis=500
click-burst-animation.overlap=true
_burst-mode.start.click-burst-animation=+isleftmousepressing | +ismiddlemousepressing | +isrightmousepressing
_burst-mode.indicator.enabled=false | _{ismousepressing | clickburstanimation} -> true
# The color of the hint under the click: a multi click or a drag clicks picks that were selected
# before the last one.
_burst-mode.indicator.fill-color=perhintrainbowgradient
_burst-mode.indicator.stroke-color=perhintrainbowgradient
_burst-mode.indicator.size=26 | _{clickburstanimation} -> 0% 30; 100% 180 exponential-out-10
_burst-mode.indicator.follow=true | _{clickburstanimation} -> false
_burst-mode.indicator.stroke-thickness=1 | _{clickburstanimation} -> 0% 30; 100% 0 exponential-out-10
_burst-mode.indicator.stroke-opacity=1 | _{clickburstanimation} -> 0% 1; 250ms 1; 500ms 0 0.7
_burst-mode.indicator.fill-opacity=0.2 | _{clickburstanimation} -> 0
# idle-mode borrows the burst to finish one that is still playing.
idle-mode.indicator=_burst-mode.indicator
idle-mode.indicator.enabled=false | _{clickburstanimation} -> true
# A hint selected without a click right away (a pick, a refine, a move) bursts the same way on
# the hint, which the pointer has not moved to.
selection-burst-animation.duration-millis=500
selection-burst-animation.overlap=true
hint-mode.start.selection-burst-animation=_{ismulti | isdual | isstickysave | isrefine | ismoveonly} ^{ctrl alt shift} +hintkey
_burst-mode.selection-burst-indicator.enabled=false | _{selectionburstanimation} -> true
_burst-mode.selection-burst-indicator.position=last-selected-hint
_burst-mode.selection-burst-indicator.follow=false
_burst-mode.selection-burst-indicator.stroke-color=last-selected-hint-box-color
_burst-mode.selection-burst-indicator.size=26 | _{selectionburstanimation} -> 0% 30; 100% 180 exponential-out-10
_burst-mode.selection-burst-indicator.stroke-thickness=1 | _{selectionburstanimation} -> 0% 30; 100% 0 exponential-out-10
_burst-mode.selection-burst-indicator.stroke-opacity=1 | _{selectionburstanimation} -> 0% 1; 250ms 1; 500ms 0 0.7
_burst-mode.selection-burst-indicator.fill-opacity=0

# Shared by every mode of a tool.
_tool-mode=_burst-mode
_tool-mode.to.idle-mode=+exitkey
_tool-mode.noop.eatkeys=+eatenkey
_tool-mode.mouse.smooth-jump-enabled=false

# A toast at the bottom left of the screen names what a key just changed. A hint key or Backspace
# typed without a modifier hides it when released, Enter when pressed: the Enter that ends a sticky
# save shows a toast, and only its press still sees the save.
toast-animation.duration-millis=3000
_tool-mode.stop.toast-animation=^{ctrl alt shift} +hintkey -hintkey | ^{ctrl alt shift} +backkey -backkey \
    | ^{ctrl alt shift isstickysave} +toolkey
_tool-mode.start.toast-animation=+isrightclick | +ismiddleclick | -isrightclick | -ismiddleclick \
    | +isdouble | +istriple | -istriple | +isctrlheld | +istextselection | +isdrag | +isdual | +ismulti | -ismulti \
    | +ismoveonly | -ismoveonly | +isstay | -isstay | +isaltheld | -isaltheld | +isshiftheld | -isshiftheld \
    | -isctrlheld | +isslowdrag | -isslowdrag | +iseachtonext | -iseachtonext \
    | +isrefine | -isrefine | +isstickysave | -isstickysave | _{isstickysave} +resetkey \
    | +isgrid | -isgrid | +isclairvoyance | -isclairvoyance | ^{isstickypositionhistoryempty} +issticky | -issticky \
    | +isnarrow | -isnarrow | +isultranarrow | -isultranarrow \
    | +isfovwindow | +isfovscreen | -isfovwindow | -isfovscreen
# The toast is a layer of the modes of a tool, so it ends when the tool does: in idle-mode,
# and with a move that leaves for hover-mode.
idle-mode.stop.toast-animation=#{*}-0
click-mode.stop.toast-animation=_{ismoveonly} #{*}-0
_tool-mode.toast-indicator.enabled=false | _{toastanimation} -> true
_tool-mode.toast-indicator.shape=rectangle
_tool-mode.toast-indicator.follow=false
_tool-mode.toast-indicator.position=active-screen-bottom-left
_tool-mode.toast-indicator.x=50
_tool-mode.toast-indicator.y=-98
_tool-mode.toast-indicator.fill-color=#111111
_tool-mode.toast-indicator.fill-opacity=1
_tool-mode.toast-indicator.stroke-thickness=1
_tool-mode.toast-indicator.stroke-color=#FFFFFF
_tool-mode.toast-indicator.stroke-opacity=0.2
_tool-mode.toast-indicator.text-style-sheet=\
td { padding: 22px; color: #909090; font-size: 17px; } \
.title { color: #FFFFFF; font-size: 21px; }
_tool-mode.toast-indicator.font-name=Segoe UI | _{ismacos} -> Helvetica Neue
# The last branch to match names the change: the keys an arm macro releases come before the
# one it presses.
_tool-mode.toast-indicator.text= \
    | -isrightclick -> <table width=714><tr><td><span class=title>Mouse Action Updated</span><br>Left Click</table> \
    | -ismiddleclick -> <table width=714><tr><td><span class=title>Mouse Action Updated</span><br>Left Click</table> \
    | -ismoveonly -> <table width=714><tr><td><span class=title>Mouse Action Updated</span><br>Left Click</table> \
    | -istriple -> <table width=714><tr><td><span class=title>Mouse Action Updated</span><br>Left Click</table> \
    | +isrightclick -> <table width=714><tr><td><span class=title>Mouse Action Updated</span><br>Right Click</table> \
    | +ismiddleclick -> <table width=714><tr><td><span class=title>Mouse Action Updated</span><br>Middle Click</table> \
    | +isdouble -> <table width=714><tr><td><span class=title>Mouse Action Updated</span><br>Double Click</table> \
    | +istriple -> <table width=714><tr><td><span class=title>Mouse Action Updated</span><br>Triple Click</table> \
    | +ismoveonly -> <table width=714><tr><td><span class=title>Mouse Action Updated</span><br>Move Mouse</table> \
    | +istextselection -> <table width=714><tr><td><span class=title>Text Selection Tool</span><br>Select two hints to select the text between them.</table> \
    | +isdrag -> <table width=714><tr><td><span class=title>Drag Tool</span><br>Select a hint to drag, then a hint to drop it on.</table> \
    | +isdual -> <table width=714><tr><td><span class=title>Dual Select Mode Enabled</span><br>Select two hints to execute.</table> \
    | _{isdrag} +isdual -> <table width=714><tr><td><span class=title>Multi Select Mode Disabled</span><br>Select two hints to execute.</table> \
    | +ismulti -> <table width=714><tr><td><span class=title>Multi Select Mode Enabled</span><br>Select multiple hints then hit Enter to execute.</table> \
    | -ismulti -> <table width=714><tr><td><span class=title>Multi Select Mode Disabled</span><br>Select one hint to execute.</table> \
    | +isstay -> <table width=714><tr><td><span class=title>Final Mouse Position</span><br>Mouse will stay at the target location.</table> \
    | -isstay -> <table width=714><tr><td><span class=title>Final Mouse Position</span><br>Mouse will return to its original position.</table> \
    | +isctrlheld -> <table width=714><tr><td><span class=title>Modifier Updated</span><br>Ctrl will be held during the action.</table> \
    | -isctrlheld -> <table width=714><tr><td><span class=title>Modifier Updated</span><br>Ctrl will not be held.</table> \
    | +isaltheld -> <table width=714><tr><td><span class=title>Modifier Updated</span><br>Alt will be held during the action.</table> \
    | -isaltheld -> <table width=714><tr><td><span class=title>Modifier Updated</span><br>Alt will not be held.</table> \
    | +isshiftheld -> <table width=714><tr><td><span class=title>Modifier Updated</span><br>Shift will be held during the action.</table> \
    | -isshiftheld -> <table width=714><tr><td><span class=title>Modifier Updated</span><br>Shift will not be held.</table> \
    | +isslowdrag -> <table width=714><tr><td><span class=title>Drag Speed Updated</span><br>The next drags run at slow speed.</table> \
    | -isslowdrag -> <table width=714><tr><td><span class=title>Drag Speed Updated</span><br>The next drags run at normal speed.</table> \
    | +iseachtonext -> <table width=714><tr><td><span class=title>Drag Path Updated</span><br>Each to Next: each selection is dragged to the point you pick after it.</table> \
    | -iseachtonext -> <table width=714><tr><td><span class=title>Drag Path Updated</span><br>All to Last: every selection is dragged straight to the last point you pick.</table> \
    | +isrefine -> <table width=714><tr><td><span class=title>Refine Mode Enabled</span><br>Select a hint, move its target, then hit Enter to execute.</table> \
    | -isrefine -> <table width=714><tr><td><span class=title>Refine Mode Disabled</span><br>Select a hint to execute.</table> \
    | +isstickysave -> <table width=714><tr><td><span class=title>Sticky Hints: Selection Mode</span><br>Select your sticky hints then hit Enter when you're done.</table> \
    | -isstickysave -> <table width=714><tr><td><span class=title>Sticky Hints: Saved</span><br>Press an assigned key to click its hint.</table> \
    | _{isstickysave} +resetkey -> <table width=714><tr><td><span class=title>Sticky Hints: Cleared</span><br>Select new sticky hints.</table> \
    | _{resetkey} +isstickysave -> <table width=714><tr><td><span class=title>Sticky Hints: Cleared</span><br>Select new sticky hints.</table> \
    | +isgrid -> <table width=714><tr><td><span class=title>Grid Mode Enabled</span><br>Hints are evenly spaced.</table> \
    | +isclairvoyance -> <table width=714><tr><td><span class=title>Clairvoyance Mode Enabled</span><br>Hints mark the elements of the active window.</table> \
    | ^{isstickypositionhistoryempty} +issticky -> <table width=714><tr><td><span class=title>Sticky Hints</span><br>Type a hint to click it. {stickysavekey} saves more, {resetkey} clears them.</table> \
    | -isgrid -> <table width=714><tr><td><span class=title>Vision Mode Enabled</span><br>Hints mark what computer vision finds.</table> \
    | -isclairvoyance -> <table width=714><tr><td><span class=title>Vision Mode Enabled</span><br>Hints mark what computer vision finds.</table> \
    | -issticky -> <table width=714><tr><td><span class=title>Vision Mode Enabled</span><br>Hints mark what computer vision finds.</table> \
    | +isnarrow -> <table width=714><tr><td><span class=title>Vision Mode Enabled</span><br>Narrow</table> \
    | +isultranarrow -> <table width=714><tr><td><span class=title>Vision Mode Enabled</span><br>UltraNarrow</table> \
    | -isnarrow -> <table width=714><tr><td><span class=title>Vision Mode Enabled</span><br>Balanced</table> \
    | -isultranarrow -> <table width=714><tr><td><span class=title>Vision Mode Enabled</span><br>Balanced</table> \
    | -isfovwindow -> <table width=714><tr><td><span class=title>Field of Vision Updated</span><br>All Monitors</table> \
    | -isfovscreen -> <table width=714><tr><td><span class=title>Field of Vision Updated</span><br>All Monitors</table> \
    | +isfovwindow -> <table width=714><tr><td><span class=title>Field of Vision Updated</span><br>Window</table> \
    | +isfovscreen -> <table width=714><tr><td><span class=title>Field of Vision Updated</span><br>Monitor</table>

# Hold ? in any mode of a tool to show a cheatsheet of the keys in the middle of the screen.
_tool-mode.cheatsheet-indicator.enabled=false | _{cheatsheetkey} -> true
_tool-mode.cheatsheet-indicator.follow=false
_tool-mode.cheatsheet-indicator.position=active-screen-center
_tool-mode.cheatsheet-indicator.shape=rectangle
_tool-mode.cheatsheet-indicator.z=1
_tool-mode.cheatsheet-indicator.text-style-sheet=\
td { color: #8C8C8C; font-size: 13px; } \
.title { color: #F2F2F2; font-size: 22px; font-weight: 600; padding-bottom: 6px; } \
.card { background-color: #161616; border: 1px solid #2A2A2A; padding: 14px 16px 12px 16px; } \
.icon { color: #D0D0D0; font-size: 15px; background-color: #1F1F1F; border: 1px solid #333333; padding: 4px 0px; } \
.gap { padding-right: 12px; } \
.name { color: #F2F2F2; font-size: 16px; font-weight: 600; } \
.about { padding-bottom: 10px; } \
.key { color: #F2F2F2; font-weight: 600; padding-right: 18px; padding-bottom: 4px; white-space: nowrap; } \
.what { padding-bottom: 4px; }
