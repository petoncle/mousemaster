ui-hint-mode.hint.mouse-movement=mouse-follows-selected-hint
# Completing a hint lands in after-hint-mode, mouse on target.
ui-hint-mode.to.after-hint-mode=^{leftshift} +uihintkey

ui-hint-mode.hint.font-name=Segoe UI
ui-hint-mode.hint.font-size=8
ui-hint-mode.hint.font-weight=bold
ui-hint-mode.hint.font-color=#FFFFFF
ui-hint-mode.hint.font-shadow-opacity=0
ui-hint-mode.hint.font-vertical-alignment=middle
ui-hint-mode.hint.font-spacing-percent=0.0
ui-hint-mode.hint.selected-font-color=#CCCCCC
ui-hint-mode.hint.box-color=#204E8A
ui-hint-mode.hint.box-opacity=1
ui-hint-mode.hint.box-border-color=#FFFFFF
ui-hint-mode.hint.box-border-opacity=1
ui-hint-mode.hint.box-border-radius=9
ui-hint-mode.hint.box-border-thickness=3
ui-hint-mode.hint.cell-horizontal-padding=10
ui-hint-mode.hint.cell-vertical-padding=2
ui-hint-mode.hint.background-color=#000000
ui-hint-mode.hint.background-opacity=0.15



# Landed on target (from a hint selection or the recursive drill); click, switch mode, or esc.
after-hint-mode=_base-mode
after-hint-mode.to.recursive-hint1-mode=_{leftctrl leftshift} +recursivehintmodekey
after-hint-mode.to.scroll-mode=_{leftctrl leftshift} +scrollmodekey
after-hint-mode.to.hint1-mode=_{leftctrl leftshift} +hintmodekey
after-hint-mode.to.ui-hint-mode=_{leftctrl leftshift} +uihintmodekey
after-hint-mode.to.monitor-mode=_{leftctrl leftshift} +monitormodekey
after-hint-mode.to.idle-mode=+esc


# Monitor mode: one big label per monitor; press its letter to jump the cursor there.
monitor-mode=_hint-base-mode
monitor-mode.hint.type=grid
monitor-mode.hint.grid-area=all-screens
monitor-mode.hint.grid-max-row-count=1
monitor-mode.hint.grid-max-column-count=1
monitor-mode.hint.selection-keys=monitorkey
monitor-mode.hint.select=^{leftshift} +monitorkey
monitor-mode.hint.mouse-movement=mouse-follows-selected-hint
# Selecting a monitor lands in after-hint-mode, cursor on that screen.
monitor-mode.to.after-hint-mode=^{leftshift} +monitorkey

monitor-mode.hint.font-name=Segoe UI
monitor-mode.hint.font-size=120
monitor-mode.hint.font-color=#FFFFFF
monitor-mode.hint.font-vertical-alignment=middle
monitor-mode.hint.cell-horizontal-padding=100
monitor-mode.hint.box-color=#000000
monitor-mode.hint.box-opacity=0.2
monitor-mode.hint.box-border-color=#FFFFFF
monitor-mode.hint.box-border-radius=50
monitor-mode.hint.box-border-thickness=5
monitor-mode.hint.box-border-opacity=1.0
