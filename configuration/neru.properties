# Launch with Ctrl+Shift+<key>: C=recursive hints, S=scroll, G=hints, Space=ui-hints, M=monitor.

# Selection key sets, by keyboard position: hintkey 6x5, extendedhintkey 4x10 (dense grids),
# hint2key 3x8 (both hands, one row of the grid per keyboard row), recursivehintkey 3x3.
key-alias.uihintkey.us-qwerty=a s d f g h j k l
key-alias.hintkey.us-qwerty=q w e r t a s d f g z x c v b y u i o p h j k l ; n m , . /
key-alias.extendedhintkey.us-qwerty=1 2 3 4 5 6 7 8 9 0 q w e r t y u i o p a s d f g h j k l ; z x c v b n m , . /
key-alias.hint2key.us-qwerty=q w e r u i o p a s d f j k l ; z x c v m , . /
key-alias.recursivehintkey.us-qwerty=r t y f g h v b n
# One label per monitor.
key-alias.monitorkey.us-qwerty=a s d f g h j k l

# Command keys, named by function so they can be rebound here. Launch keys use Ctrl+Shift.
key-alias.uihintmodekey.us-qwerty=space
key-alias.hintmodekey.us-qwerty=g
key-alias.recursivehintmodekey.us-qwerty=c
key-alias.scrollmodekey.us-qwerty=s
key-alias.monitormodekey.us-qwerty=m
# Backtick toggles mouse-follow in recursive hint.
key-alias.mousefollowshintkey.us-qwerty=`
# Clicks are pressed with Shift: L/R/M buttons, I holds the left button down, U releases it.
key-alias.leftclickkey.us-qwerty=l
key-alias.rightclickkey.us-qwerty=r
key-alias.middleclickkey.us-qwerty=m
key-alias.mousedownkey.us-qwerty=i
key-alias.mouseupkey.us-qwerty=u
# Mouse movement: hold an arrow to move in that direction.
key-alias.moveupkey.us-qwerty=uparrow
key-alias.movedownkey.us-qwerty=downarrow
key-alias.moveleftkey.us-qwerty=leftarrow
key-alias.moverightkey.us-qwerty=rightarrow



# Mode-entry hotkeys (work from idle and from within any mode).
idle-mode.to.recursive-hint1-mode=_{leftctrl leftshift} +recursivehintmodekey
idle-mode.to.scroll-mode=_{leftctrl leftshift} +scrollmodekey
idle-mode.to.hint1-mode=_{leftctrl leftshift} +hintmodekey
idle-mode.to.ui-hint-mode=_{leftctrl leftshift} +uihintmodekey
idle-mode.to.monitor-mode=_{leftctrl leftshift} +monitormodekey

scroll-mode.to.recursive-hint1-mode=_{leftctrl leftshift} +recursivehintmodekey
scroll-mode.to.hint1-mode=_{leftctrl leftshift} +hintmodekey
scroll-mode.to.ui-hint-mode=_{leftctrl leftshift} +uihintmodekey
scroll-mode.to.monitor-mode=_{leftctrl leftshift} +monitormodekey
scroll-mode.to.idle-mode=+esc

hint1-mode.to.recursive-hint1-mode=_{leftctrl leftshift} +recursivehintmodekey
hint1-mode.to.scroll-mode=_{leftctrl leftshift} +scrollmodekey
hint1-mode.to.ui-hint-mode=_{leftctrl leftshift} +uihintmodekey
hint1-mode.to.monitor-mode=_{leftctrl leftshift} +monitormodekey
hint1-mode.to.idle-mode=+esc | +backspace

hint2-mode.to.recursive-hint1-mode=_{leftctrl leftshift} +recursivehintmodekey
hint2-mode.to.scroll-mode=_{leftctrl leftshift} +scrollmodekey
hint2-mode.to.ui-hint-mode=_{leftctrl leftshift} +uihintmodekey
hint2-mode.to.monitor-mode=_{leftctrl leftshift} +monitormodekey
# Backspace goes back to the first grid rather than out.
hint2-mode.to.hint1-mode=+backspace
hint2-mode.to.idle-mode=+esc

ui-hint-mode.to.recursive-hint1-mode=_{leftctrl leftshift} +recursivehintmodekey
ui-hint-mode.to.scroll-mode=_{leftctrl leftshift} +scrollmodekey
ui-hint-mode.to.hint1-mode=_{leftctrl leftshift} +hintmodekey
ui-hint-mode.to.monitor-mode=_{leftctrl leftshift} +monitormodekey
ui-hint-mode.to.idle-mode=+esc | +backspace

monitor-mode.to.recursive-hint1-mode=_{leftctrl leftshift} +recursivehintmodekey
monitor-mode.to.scroll-mode=_{leftctrl leftshift} +scrollmodekey
monitor-mode.to.hint1-mode=_{leftctrl leftshift} +hintmodekey
monitor-mode.to.ui-hint-mode=_{leftctrl leftshift} +uihintmodekey
monitor-mode.to.idle-mode=+esc | +backspace


# Shared base, inherited by every mode.
_base-mode.mouse.initial-velocity=180
_base-mode.mouse.max-velocity=650
_base-mode.mouse.acceleration=900
_base-mode.start-move.up=+moveupkey
_base-mode.start-move.down=+movedownkey
_base-mode.start-move.left=+moveleftkey
_base-mode.start-move.right=+moverightkey
_base-mode.stop-move.up=-moveupkey
_base-mode.stop-move.down=-movedownkey
_base-mode.stop-move.left=-moveleftkey
_base-mode.stop-move.right=-moverightkey

# Shift-prefixed so clicks don't collide with the letter selection keys.
# Shift+L/R/M = left/right/middle click; Shift+I = mouse down, Shift+U = mouse up.
_base-mode.noop.eatleftshift=+leftshift
_base-mode.press.left=_{leftshift} +leftclickkey | _{leftshift} +mousedownkey
_base-mode.release.left=_{leftshift} -leftclickkey | _{leftshift} +mouseupkey
_base-mode.press.right=_{leftshift} +rightclickkey
_base-mode.release.right=_{leftshift} -rightclickkey
_base-mode.press.middle=^{leftctrl} _{leftshift} +middleclickkey
_base-mode.release.middle=_{leftshift} -middleclickkey

# Indicator colors.
_base-mode.indicator.enabled=true
_base-mode.indicator.idle.color=#FF0000
_base-mode.indicator.idle.inner-outline-color=#FF0000
_base-mode.indicator.move.color=#FF0000
_base-mode.indicator.move.inner-outline-color=#FF0000
_base-mode.indicator.wheel.color=#FFFF00
_base-mode.indicator.wheel.inner-outline-color=#FFFF00
_base-mode.indicator.mouse-press.color=#00FF00
_base-mode.indicator.mouse-press.inner-outline-color=#00FF00

# Hint modes only.
_hint-base-mode=_base-mode
_hint-base-mode.hint.transition-animation-duration-millis=200
_hint-base-mode.hint.fade-animation-duration-millis=100
_hint-base-mode.indicator.idle.opacity=0
_hint-base-mode.indicator.idle.inner-outline-opacity=0
_hint-base-mode.indicator.mouse-press.opacity=0.2
_hint-base-mode.indicator.mouse-press.inner-outline-opacity=1



# Recursive hint: 3x3 positional narrowing, one mode per depth level.
#     r  t  y      each keypress narrows to that ninth of the current region
#     f  g  h      (g = center); repeat until the mouse is on target.
#     v  b  n
_recursive-hint-mode=_hint-base-mode

# false for the dots style: a + over the whole region, and a dot in place of each cell's key preview.
variable.showrecursivehintkeys=true

_recursive-hint-mode.hint.type=grid
_recursive-hint-mode.hint.grid-area=last-selected-hint-cell
_recursive-hint-mode.hint.grid-max-row-count=3
_recursive-hint-mode.hint.grid-max-column-count=3
_recursive-hint-mode.hint.grid-cell-sizing=fit
_recursive-hint-mode.hint.selection-keys=recursivehintkey
_recursive-hint-mode.hint.select=^{leftshift} +recursivehintkey
# Cursor tracks the current region's center; backtick toggles it off and back on.
_recursive-hint-mode.hint.mouse-movement=mouse-follows-hint-grid-center | _{mousefollowshint} -> no-movement
_recursive-hint-mode.set-variable.mousefollowshint=_{!mousefollowshint} +mousefollowshintkey
_recursive-hint-mode.unset-variable.mousefollowshint=_{mousefollowshint} +mousefollowshintkey

_recursive-hint-mode.hint.font-name=Segoe UI
_recursive-hint-mode.hint.font-color=#FFFFFF
_recursive-hint-mode.hint.font-weight=thin
_recursive-hint-mode.hint.selected-font-color=#FFFFFF
_recursive-hint-mode.hint.box-color=#000000
_recursive-hint-mode.hint.box-opacity=0.2
_recursive-hint-mode.hint.box-border-color=#FFFFFF
_recursive-hint-mode.hint.box-border-thickness=2
_recursive-hint-mode.hint.box-border-opacity=0.4

# White hint letters with a shadow; each cell previews the next drill's 3x3 keys in white.
_recursive-hint-mode.hint.font-opacity=1 | _{!showrecursivehintkeys} -> 0
_recursive-hint-mode.hint.font-shadow-opacity=1
_recursive-hint-mode.hint.font-shadow-blur-radius=10
_recursive-hint-mode.hint.subdecoration-max-row-count=3
_recursive-hint-mode.hint.subdecoration-max-column-count=3
_recursive-hint-mode.hint.subdecoration-label-keys=recursivehintkey
_recursive-hint-mode.hint.subdecoration-font-name=Segoe UI
_recursive-hint-mode.hint.subdecoration-font-color=#FFFFFF
_recursive-hint-mode.hint.subdecoration-font-weight=thin
_recursive-hint-mode.hint.subdecoration-box-border-opacity=0

_recursive-hint-mode.hint.decoration-max-row-count=1
_recursive-hint-mode.hint.decoration-max-column-count=1
_recursive-hint-mode.hint.decoration-label-override=plus
_recursive-hint-mode.hint.decoration-font-name=Segoe UI
_recursive-hint-mode.hint.decoration-font-color=#FFFFFF
_recursive-hint-mode.hint.decoration-font-weight=thin
_recursive-hint-mode.hint.decoration-font-vertical-alignment=middle
_recursive-hint-mode.hint.decoration-font-opacity=0 | _{!showrecursivehintkeys} -> 1
_recursive-hint-mode.hint.decoration-font-shadow-opacity=1
_recursive-hint-mode.hint.subdecoration-label-override=_{!showrecursivehintkeys} -> .
_recursive-hint-mode.hint.subdecoration-font-vertical-alignment=_{!showrecursivehintkeys} -> middle
_recursive-hint-mode.to.scroll-mode=_{leftctrl leftshift} +scrollmodekey
_recursive-hint-mode.to.hint1-mode=_{leftctrl leftshift} +hintmodekey
_recursive-hint-mode.to.ui-hint-mode=_{leftctrl leftshift} +uihintmodekey
_recursive-hint-mode.to.monitor-mode=_{leftctrl leftshift} +monitormodekey
_recursive-hint-mode.to.idle-mode=+esc
# Space resets to the top-level (full-screen) grid.
_recursive-hint-mode.to.recursive-hint1-mode=^{leftctrl leftshift} +space

# Top level: the whole screen; backspace exits.
recursive-hint1-mode=_recursive-hint-mode
recursive-hint1-mode.hint.grid-area=active-screen
recursive-hint1-mode.hint.grid-area-center=screen-center
recursive-hint1-mode.hint.font-size=60
recursive-hint1-mode.hint.subdecoration-font-size=20 | _{!showrecursivehintkeys} -> 40
recursive-hint1-mode.hint.decoration-font-size=60
recursive-hint1-mode.to.idle-mode=+esc | +backspace
recursive-hint1-mode.to.recursive-hint2-mode=^{leftshift} +recursivehintkey

recursive-hint2-mode=_recursive-hint-mode
recursive-hint2-mode.hint.font-size=20
recursive-hint2-mode.hint.font-shadow-blur-radius=3
recursive-hint2-mode.hint.subdecoration-font-size=7 | _{!showrecursivehintkeys} -> 14
recursive-hint2-mode.hint.decoration-font-size=20
recursive-hint2-mode.to.recursive-hint3-mode=^{leftshift} +recursivehintkey
recursive-hint2-mode.to.recursive-hint1-mode=+backspace | ^{leftctrl leftshift} +space

recursive-hint3-mode=_recursive-hint-mode
recursive-hint3-mode.hint.font-size=7
recursive-hint3-mode.hint.font-shadow-blur-radius=1
recursive-hint3-mode.hint.subdecoration-font-size=3 | _{!showrecursivehintkeys} -> 6
recursive-hint3-mode.hint.decoration-font-size=10
recursive-hint3-mode.to.recursive-hint4-mode=^{leftshift} +recursivehintkey
recursive-hint3-mode.to.recursive-hint2-mode=+backspace

recursive-hint4-mode=_recursive-hint-mode
recursive-hint4-mode.hint.font-size=3
recursive-hint4-mode.hint.font-shadow-opacity=0
recursive-hint4-mode.hint.subdecoration-font-opacity=0
recursive-hint4-mode.hint.decoration-font-size=5
recursive-hint4-mode.to.recursive-hint5-mode=^{leftshift} +recursivehintkey
recursive-hint4-mode.to.recursive-hint3-mode=+backspace

recursive-hint5-mode=_recursive-hint-mode
recursive-hint5-mode.hint.font-opacity=0
recursive-hint5-mode.hint.subdecoration-font-opacity=0
recursive-hint5-mode.hint.decoration-font-size=4
recursive-hint5-mode.to.after-hint-mode=^{leftshift} +recursivehintkey
recursive-hint5-mode.to.recursive-hint4-mode=+backspace


