<tr><td><td class=key>{edge} {up} {left} {down} {right}<td>snap to the screen edges\
<tr><td><td class=key>{jump} {up} {left} {down} {right}<td>jump a quarter of the screen\
<tr><td>&nbsp;\
<tr><td class=section>CLICK<td class=key>{leftbutton} {rightbutton} {middlebutton}<td>left right middle\
<tr><td><td class=key>{toggleleft}<td>hold or release left\
