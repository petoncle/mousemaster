ui-hint-mode.overlay.font-spacing-percent=0
ui-hint-mode.overlay.box-color=across-screen per-pixel center-to-edge #F97316 #EAB308 #84CC16 #22C55E #14B8A6 #06B6D4 #3B82F6
ui-hint-mode.overlay.box-opacity=1
ui-hint-mode.overlay.box-horizontal-padding=2.5
ui-hint-mode.overlay.box-vertical-padding=0
ui-hint-mode.overlay.box-border-opacity=1
ui-hint-mode.overlay.box-border-thickness=1
ui-hint-mode.overlay.box-border-radius=2
ui-hint-mode.overlay.background-opacity=0.2

# Recursive hint: 3x3 positional narrowing, one mode per depth level.
#     w  e  r      each keypress narrows to that ninth of the current region
#     s  d  f      (d = center); repeat until the mouse is on target.
#     x  c  v
# A virtual key has no hardware key behind it.
# showrecursivehintkeys is pressed from the start: released gives the dots style, a plus over
# the whole region and a dot in place of each cell's key preview.
virtual-key.showrecursivehintkeys=pressed
virtual-key.mousefollowshint=pressed
normal-mode.to.recursive-hint1-mode=+recursivehint
_recursive-hint-mode=_indicator-mode
_recursive-hint-mode.press=normal-mode.press
_recursive-hint-mode.release=normal-mode.release
_recursive-hint-mode.toggle=normal-mode.toggle
_recursive-hint-mode.overlay.area=last-selected-hint-cell
_recursive-hint-mode.overlay.grid-cell-sizing=fit
_recursive-hint-mode.overlay.grid-max-row-count=3
_recursive-hint-mode.overlay.grid-max-column-count=3
_recursive-hint-mode.overlay.selection-keys=recursivehintkey
_recursive-hint-mode.overlay.select=+recursivehintkey
