idle-mode.to.ui-hint-mode=+uihintmod +uihint | _{uihintmod} +uihint
normal-mode.to.ui-hint-mode=+uihintmod +uihint | _{uihintmod} +uihint
ui-hint-mode.to.previous-mode-from-history-stack=+esc | +backspace | _{ishintmeshempty}
ui-hint-mode.to.normal-mode=+hint1key
ui-hint-mode.break-combo-preparation=+hint1key
ui-hint-mode=_indicator-mode
ui-hint-mode.overlay.type=ui-vision
ui-hint-mode.overlay.area=active-window
ui-hint-mode.overlay.selection-keys=hint1key
ui-hint-mode.overlay.select=+hint1key
ui-hint-mode.overlay.deselect=+backspace
