idle-mode.push-mode-to-history-stack=true
normal-mode.push-mode-to-history-stack=true
normal-mode=_indicator-mode _arrowremapping-mode
idle-mode.macro=_arrowremapping-mode.macro

# Press e while holding leftalt to activate, or press capslock while holding leftalt.
idle-mode.to.normal-mode=+enablemod +enablekey | _{enablemod} +enablekey

# The following keys can be used to go back to idle mode:
# exit keys (q or p), click-then-disable key (.), leftalt + e, leftalt + capslock,
# leftctrl + f, leftctrl + l, leftctrl + e, f2, f3,  /.
normal-mode.to.idle-mode=+exit | -clickthendisable | +enablemod +enablekey | _{enablemod} +enablekey \
  | _{leftctrl} #f | _{leftctrl} #l | _{leftctrl} #e | #f2 | #f3 | ^{leftshift rightshift} #/
normal-mode.mouse.initial-velocity=1000
normal-mode.mouse.max-velocity=2200 | _{slow} ^{superslow} -> 350 | _{fast} -> 4500 | _{superslow} -> 75
normal-mode.mouse.acceleration=3000 | _{fast} -> 5000
normal-mode.wheel.initial-velocity=1500
normal-mode.wheel.max-velocity=2000 | _{slow} ^{superslow} -> 200 | _{fast} -> 10000 | _{superslow} -> 50
normal-mode.wheel.acceleration=500 | _{fast} -> 10000
# Start moving with direction keys.
# When releasing the edge/jump key, if direction keys are already pressed then start moving.
normal-mode.start-move.up=^{arrowmod} +up | _{up} -edge | _{up} -jump
normal-mode.start-move.down=^{arrowmod} +down | _{down} -edge | _{down} -jump
normal-mode.start-move.left=^{arrowmod} +left | _{left} -edge | _{left} -jump
normal-mode.start-move.right=^{arrowmod} +right | _{right} -edge | _{right} -jump
# Stop moving by releasing direction keys.
# If the edge/jump/grid/hint/recursivehint/screenselection key is pressed, then stop moving.
normal-mode.stop-move.up=-up | #edge | +jump | +grid | +hint | +recursivehint | +screenselection
normal-mode.stop-move.down=-down | #edge | +jump | +grid | +hint | +recursivehint | +screenselection
normal-mode.stop-move.left=-left | #edge | +jump | +grid | +hint | +recursivehint | +screenselection
normal-mode.stop-move.right=-right | #edge | +jump | +grid | +hint | +recursivehint | +screenselection
# Register leftctrl to allow ctrl-clicking.
normal-mode.press.left=_{none | leftctrl} +leftbutton | _{none | leftctrl} +clickthendisable
normal-mode.press.middle=^{uihintmod} +middlebutton
normal-mode.press.right=_{none | leftctrl} +rightbutton
normal-mode.release.left=-leftbutton
normal-mode.release.middle=-middlebutton
normal-mode.release.right=-rightbutton
normal-mode.toggle.left=_{none | leftctrl} +toggleleft
normal-mode.start-wheel.up=+wheelup
normal-mode.start-wheel.down=+wheeldown
normal-mode.start-wheel.left=+wheelleft
normal-mode.start-wheel.right=+wheelright
normal-mode.stop-wheel.up=-wheelup
normal-mode.stop-wheel.down=-wheeldown
normal-mode.stop-wheel.left=-wheelleft
normal-mode.stop-wheel.right=-wheelright

# Eat the fast and superslow key presses to prevent them from reaching apps.
# Eat the slow key press (leftshift) only when scrolling vertically to prevent horizontal scroll behavior in certain apps.
normal-mode.noop.eatspeedmods=_{wheelup | wheeldown} +slow | +fast | +superslow

# Snap to screen edges.
normal-mode.to.edge-mode=#edge
edge-mode.noop.eatspeedmods=+slow | +fast | +superslow
edge-mode.to.normal-mode=-edge
edge-mode=_indicator-mode
edge-mode.mouse=normal-mode.mouse
edge-mode.press=normal-mode.press
edge-mode.release=normal-mode.release
edge-mode.toggle=normal-mode.toggle
# Invisible grid used for snapping/attaching to the screen's edges.
edge-mode.overlay.area=active-screen
edge-mode.overlay.area-width-percent=0.80
edge-mode.overlay.area-height-percent=0.95
edge-mode.overlay.grid-cell-sizing=fit
edge-mode.overlay.grid-max-row-count=1
edge-mode.overlay.grid-max-column-count=1
# Change visible to true to see the edge lines.
edge-mode.overlay.visible=false
edge-mode.snap-target.up=+up | _{up} +edge
edge-mode.snap-target.down=+down | _{down} +edge
edge-mode.snap-target.left=+left | _{left} +edge
edge-mode.snap-target.right=+right | _{right} +edge

normal-mode.to.jump-mode=+jump
jump-mode.noop.eatspeedmods=+slow | +fast | +superslow
jump-mode.to.normal-mode=-jump
jump-mode=_indicator-mode
jump-mode.mouse=normal-mode.mouse
jump-mode.stop-move=normal-mode.stop-move
# Invisible grid that is centered around the mouse and has a width and height equal to
# half the screen's width and height.
jump-mode.overlay.area=active-screen
jump-mode.overlay.area-width-percent=0.5
jump-mode.overlay.area-height-percent=0.5
jump-mode.overlay.area-center=mouse
jump-mode.overlay.grid-cell-sizing=fit
jump-mode.overlay.grid-max-row-count=1
jump-mode.overlay.grid-max-column-count=1
# Change visible to true to see the edge lines.
jump-mode.overlay.visible=false
# Jump with direction keys, or by pressing the jump key (if direction keys are already pressed).
jump-mode.snap-target.up=+up | _{up} +jump
jump-mode.snap-target.down=+down | _{down} +jump
jump-mode.snap-target.left=+left | _{left} +jump
jump-mode.snap-target.right=+right | _{right} +jump

# Grid is enabled with g, disabled with g or esc.
# Press direction keys to shrink the grid in one direction.
normal-mode.to.grid-mode=^{windowmod} +grid
grid-mode.to.normal-mode=+grid | +esc
grid-mode.to.idle-mode=+exit
grid-mode=_indicator-mode
grid-mode.overlay.area=active-screen
grid-mode.overlay.area-width-percent=0.99
grid-mode.overlay.area-height-percent=0.99
grid-mode.overlay.grid-cell-sizing=fit
grid-mode.overlay.grid-max-row-count=2
grid-mode.overlay.grid-max-column-count=2
grid-mode.overlay.target-follows-overlay-center=true
grid-mode.overlay.box-color=#FF0000
grid-mode.overlay.box-opacity=0.1
grid-mode.overlay.box-border-color=#FF0000
grid-mode.overlay.box-border-opacity=1
grid-mode.shrink-grid.up=+up
grid-mode.shrink-grid.down=+down
grid-mode.shrink-grid.left=+left
grid-mode.shrink-grid.right=+right

# Window mode is enabled by holding windowmod and pressing the grid key (g).
# It is exited as soon as windowmod is released.
# Move to the active window's edges with direction keys.
# Move to the active window's center with the grid key (g).
normal-mode.noop.eatwindowmod=+windowmod
normal-mode.to.window-mode=_{windowmod} +grid
window-mode.to.normal-mode=-windowmod
window-mode=_indicator-mode
window-mode.overlay.area=active-window
# Top inset to be able to quickly access a window's title bar (and potentially grab it and move the window).
window-mode.overlay.area-top-inset=15
window-mode.overlay.grid-cell-sizing=fit
window-mode.overlay.grid-max-row-count=1
window-mode.overlay.grid-max-column-count=1
window-mode.overlay.target-follows-overlay-center=true
window-mode.overlay.box-color=#FF0000
window-mode.overlay.box-opacity=0.1
window-mode.overlay.box-border-color=#FF0000
window-mode.overlay.box-border-opacity=1
window-mode.snap-target.up=+up
window-mode.snap-target.down=+down
window-mode.snap-target.left=+left
window-mode.snap-target.right=+right
window-mode.move-target-to.grid-center=+grid

# Hints are enabled with f, disabled with f or esc.
# Holding hint2mod while selecting the hint will trigger a second hint pass with a smaller hint grid
# centered around the mouse to refine the position.
normal-mode.to.hint1-mode=^{uihintmod} +hint
# Go back to normal-mode when esc, backspace, or the last letter of the hint is pressed.
hint1-mode.to.normal-mode=+esc | +backspace | ^{hint2mod} +extendedhint1key
# Prevent final hint key press from executing commands in next mode (e.g. n -> toggle left click)
hint1-mode.break-combo-preparation=+extendedhint1key
hint1-mode.hide-cursor.enabled=true
hint1-mode.overlay.area=active-screen
hint1-mode.overlay.area-center=screen-center
hint1-mode.overlay.transition-animation-duration-millis=200
hint1-mode.overlay.fade-animation-duration-millis=100
# Fit cell sizing: the cell count below is what a screen gets, and cells stretch to fill it.
hint1-mode.overlay.grid-cell-sizing=fit
# A label is two keys: one per layout block, one per cell in it, so both counts have to fit
# the selection key set (hint1key 30 keys, extendedhint1key 40).
hint1-mode.overlay.grid-max-column-count=25 | _{mediumscreen | largescreen} -> 40
hint1-mode.overlay.grid-max-row-count=30 | _{smallscreen} -> 20 | _{mediumscreen | largescreen} -> 40
hint1-mode.overlay.layout-row-count=6 | _{smallscreen} -> 5 | _{mediumscreen | largescreen} -> 4
hint1-mode.overlay.layout-column-count=5 | _{mediumscreen | largescreen} -> 10
hint1-mode.overlay.selection-keys=hint1key | _{mediumscreen | largescreen} -> extendedhint1key
hint1-mode.overlay.select=_{none | hint2mod} +extendedhint1key
hint1-mode.overlay.font-name=Segoe UI | _{ismacos} -> Helvetica Neue
hint1-mode.overlay.font-size=18 | _{smallscreen} -> 12
hint1-mode.overlay.box-color=#000000 | _{hint2mod} -> #004400
hint1-mode.overlay.prefix-box-enabled=true
hint1-mode.overlay.prefix-in-background=true
hint1-mode.overlay.prefix-font-name=Segoe UI | _{ismacos} -> Helvetica Neue
hint1-mode.overlay.prefix-font-weight=light
hint1-mode.overlay.prefix-font-size=100 | _{smallscreen} -> 80 | _{mediumscreen | largescreen} -> 60
hint1-mode.overlay.prefix-font-color=#FFD93D
hint1-mode.overlay.prefix-selected-font-color=#CCCCCC
hint1-mode.overlay.prefix-font-opacity=0.8
hint1-mode.overlay.prefix-font-shadow-opacity=0
hint1-mode.overlay.selected-font-opacity=0.5
hint1-mode.overlay.deselect=+backspace

