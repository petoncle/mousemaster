_recursive-hint-mode.overlay.font-shadow-opacity=1
_recursive-hint-mode.overlay.font-shadow-blur-radius=10
_recursive-hint-mode.overlay.box-color=#000000
_recursive-hint-mode.overlay.box-opacity=0.2
_recursive-hint-mode.overlay.box-border-color=#FFFFFF
_recursive-hint-mode.overlay.box-border-thickness=1
_recursive-hint-mode.overlay.box-border-opacity=0.4
