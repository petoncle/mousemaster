hint2-mode.overlay.selection-keys=hint2key | _{mediumscreen | largescreen} -> extendedhint2key
hint2-mode.overlay.font-size=9 | _{smallscreen | mediumscreen} -> 6 | _{largescreen} -> 8
hint2-mode.overlay.box-color=#000000
hint2-mode.overlay.prefix-in-background=false
hint2-mode.overlay.prefix-box-enabled=false
