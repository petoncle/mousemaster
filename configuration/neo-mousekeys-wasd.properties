_recursive-hint-mode.overlay.subdecoration-box-border-opacity=0
_recursive-hint-mode.overlay.subdecoration-label-override=^{showrecursivehintkeys} -> .
_recursive-hint-mode.overlay.subdecoration-font-vertical-alignment=middle
_recursive-hint-mode.overlay.decoration-max-row-count=1
_recursive-hint-mode.overlay.decoration-max-column-count=1
_recursive-hint-mode.overlay.decoration-label-override=plus
_recursive-hint-mode.overlay.decoration-font-name=Segoe UI | _{ismacos} -> Helvetica Neue
_recursive-hint-mode.overlay.decoration-font-weight=thin
_recursive-hint-mode.overlay.decoration-font-color=#FFFFFF
_recursive-hint-mode.overlay.decoration-font-opacity=0 | ^{showrecursivehintkeys} -> 1
_recursive-hint-mode.overlay.decoration-font-shadow-opacity=1
_recursive-hint-mode.overlay.decoration-font-vertical-alignment=middle
# Prevent final hint key press from executing commands in next mode (e.g. n -> toggle left click).
_recursive-hint-mode.break-combo-preparation=+recursivehintkey
# Space resets to the top-level (full-screen) grid.
_recursive-hint-mode.to.recursive-hint1-mode=+space
