<tr><td>&nbsp;\
<tr><td class=section>WHEEL<td class=key>{wheelup} {wheeldown} {wheelleft} {wheelright}<td>up down left right\
<tr><td>&nbsp;\
<tr><td class=section>HINTS<td class=key>{hint}<td>screen\
<tr><td><td class=key>{hint2mod} {hint}<td>finer screen\
<tr><td><td class=key>{uihintmod} {uihint}<td>ui elements\
<tr><td><td class=key>{recursivehint}<td>recursive\
<tr><td><td class=key>{grid}<td>grid\
