# mousemaster will automatically convert the key aliases to your current keyboard layout.
# However, if you want to make a change to the key aliases, and your keyboard layout
# is not us-qwerty, then remove .us-qwerty
key-alias.exit.us-qwerty=; esc
key-alias.up.us-qwerty=k
key-alias.down.us-qwerty=j
key-alias.left.us-qwerty=h
key-alias.right.us-qwerty=l
key-alias.edge.us-qwerty=leftalt
key-alias.wheelup.us-qwerty=i
key-alias.wheeldown.us-qwerty=u
key-alias.wheelleft.us-qwerty=y
key-alias.wheelright.us-qwerty=o
key-alias.leftbutton.us-qwerty=a
key-alias.rightbutton.us-qwerty=s
key-alias.middlebutton.us-qwerty=d
key-alias.fast.us-qwerty=f
key-alias.slow.us-qwerty=space
key-alias.cheatsheet.us-qwerty=f1
key-alias.hint1key.us-qwerty=q w e r t a s d f g z x c v b y u i o p h j k l ; n m , . /
key-alias.hint2key.us-qwerty=q w e r u i o p a s d f j k l ; z x c v m , . /
key-alias.extendedhint1key.us-qwerty=1 2 3 4 5 6 7 8 9 0 q w e r t y u i o p a s d f g h j k l ; z x c v b n m , . /
key-alias.extendedhint2key.us-qwerty=1 2 3 4 5 6 7 8 9 0 q w e r t y u i o p a s d f g h j k l ; z x c v b n m , . /

screen-alias.largescreen= \
    3440x1440-100% \
    3840x1600-100% \
    3840x2160-100% \
    5120x1440-100% \
    6016x3384-200%
screen-alias.mediumscreen= \
    2560x1440-100% \
    2560x1600-100% \
    3840x2160-150% \
    4480x2520-200% \
    5120x2880-200%
screen-alias.smallscreen= \
    1366x768-100% \
    1920x1080-125% \
    1920x1080-150% \
    2880x1800-200% \
    2940x1912-200% \
    3024x1964-200% \
    3840x2160-300%

# Press then release leftctrl, twice in a row.
# The press is not eaten (other apps can use it), this is the meaning of # in #leftctrl.
idle-mode.to.normal-mode=#leftctrl -leftctrl +leftctrl -leftctrl | #rightctrl -rightctrl +rightctrl -rightctrl
normal-mode=_indicator-mode
normal-mode.push-mode-to-history-stack=true
normal-mode.to.idle-mode=+exit
normal-mode.mouse.initial-velocity=1000
normal-mode.mouse.max-velocity=2200 | _{slow} -> 250 | _{fast} -> 4500
normal-mode.mouse.acceleration=3000 | _{fast} -> 5000
normal-mode.wheel.initial-velocity=1500
normal-mode.wheel.max-velocity=2000 | _{slow} -> 200 | _{fast} -> 10000
normal-mode.wheel.acceleration=500 | _{fast} -> 10000
# Start moving with direction keys.
# When releasing the edge key, if direction keys are already pressed then start moving.
normal-mode.start-move.up=+up | _{up} -edge
normal-mode.start-move.down=+down | _{down} -edge
normal-mode.start-move.left=+left | _{left} -edge
normal-mode.start-move.right=+right | _{right} -edge
# Stop moving by releasing direction keys.
# If the edge key is pressed (the # in #edge indicates the edge key press should not be eaten), then stop moving.
normal-mode.stop-move.up=-up | #edge
normal-mode.stop-move.down=-down | #edge
normal-mode.stop-move.left=-left | #edge
normal-mode.stop-move.right=-right | #edge
normal-mode.press.left=+leftbutton
normal-mode.press.middle=+middlebutton
normal-mode.press.right=+rightbutton
normal-mode.release.left=-leftbutton
normal-mode.release.middle=-middlebutton
normal-mode.release.right=-rightbutton
normal-mode.start-wheel.up=+wheelup
normal-mode.start-wheel.down=+wheeldown
normal-mode.start-wheel.left=+wheelleft
normal-mode.start-wheel.right=+wheelright
normal-mode.stop-wheel.up=-wheelup
normal-mode.stop-wheel.down=-wheeldown
normal-mode.stop-wheel.left=-wheelleft
normal-mode.stop-wheel.right=-wheelright
normal-mode.overlay.visible=false
normal-mode.overlay.grid-cell-sizing=fit
normal-mode.overlay.grid-max-row-count=1
normal-mode.overlay.grid-max-column-count=1
normal-mode.move-target-to.grid-center=_{leftshift} +m

normal-mode.noop.eatspeedmods=+slow | +fast

# Snap to screen edges.
normal-mode.to.edge-mode=#edge
edge-mode.noop.eatspeedmods=+slow | +fast
edge-mode.to.normal-mode=-edge
edge-mode=_indicator-mode
edge-mode.mouse=normal-mode.mouse
edge-mode.press=normal-mode.press
edge-mode.release=normal-mode.release
edge-mode.toggle=normal-mode.toggle
# Invisible grid used for snapping/attaching to the screen's edges.
edge-mode.overlay.area=active-screen
edge-mode.overlay.area-width-percent=0.80
edge-mode.overlay.area-height-percent=0.95
edge-mode.overlay.grid-cell-sizing=fit
edge-mode.overlay.grid-max-row-count=1
edge-mode.overlay.grid-max-column-count=1
# Change visible to true to see the edge lines.
edge-mode.overlay.visible=false
edge-mode.snap-target.up=+up | _{up} +edge
edge-mode.snap-target.down=+down | _{down} +edge
edge-mode.snap-target.left=+left | _{left} +edge
edge-mode.snap-target.right=+right | _{right} +edge

# When a mode is pushed onto the top of the history stack,
# other modes can refer to it using previous-mode-from-history-stack.
idle-mode.push-mode-to-history-stack=true

# Grid is enabled with leftshift (double press), disabled with leftshift (single press) or ;
# Press h, k, j, l to shrink the grid in one direction.
# Hold leftshift while pressing h, k, j, l to move the grid in one direction.
idle-mode.to.grid-mode=#leftshift -leftshift +leftshift -leftshift
normal-mode.to.grid-mode=#leftshift -leftshift +leftshift -leftshift
grid-mode.to.previous-mode-from-history-stack=+leftshift -leftshift | +exit
grid-mode.overlay.area=active-screen
grid-mode.overlay.area-width-percent=0.99
grid-mode.overlay.area-height-percent=0.99
grid-mode.overlay.grid-cell-sizing=fit
grid-mode.overlay.grid-max-row-count=2
grid-mode.overlay.grid-max-column-count=2
grid-mode.overlay.target-follows-overlay-center=true
grid-mode.overlay.box-color=#FF0000
grid-mode.overlay.box-opacity=0.1
grid-mode.overlay.box-border-color=#FF0000
grid-mode.overlay.box-border-opacity=1
grid-mode.shrink-grid.up=^{leftshift} +up
grid-mode.shrink-grid.down=^{leftshift} +down
grid-mode.shrink-grid.left=^{leftshift} +left
grid-mode.shrink-grid.right=^{leftshift} +right
grid-mode.move-grid.up=_{leftshift} +up
grid-mode.move-grid.down=_{leftshift} +down
grid-mode.move-grid.left=_{leftshift} +left
grid-mode.move-grid.right=_{leftshift} +right

# Hints are enabled with leftalt (double press), disabled with leftalt (single press)
# Holding leftshift while selecting the hint will trigger a mouse click (in addition to moving the mouse)
# Holding leftctrl while selecting the hint will trigger a second hint pass with a smaller hint grid
# centered around the mouse to refine the position
idle-mode.to.hint1-mode=#leftalt -leftalt +leftalt -leftalt
edge-mode.to.hint1-mode=#leftalt -leftalt +leftalt -leftalt
hint1-mode.to.previous-mode-from-history-stack=+leftalt -leftalt | +esc | +backspace | +extendedhint1key
hint1-mode.break-combo-preparation=+extendedhint1key
hint1-mode.hide-cursor.enabled=true
hint1-mode.overlay.area=active-screen
hint1-mode.overlay.area-center=screen-center
hint1-mode.overlay.transition-animation-duration-millis=200
hint1-mode.overlay.fade-animation-duration-millis=100
hint1-mode.overlay.grid-cell-sizing=fit
# A label is two keys: one per layout block, one per cell in it, so both counts have to fit
# the selection key set (hint1key 30 keys, extendedhint1key 40).
hint1-mode.overlay.grid-max-column-count=25 | _{mediumscreen | largescreen} -> 40
hint1-mode.overlay.grid-max-row-count=30 | _{smallscreen} -> 20 | _{mediumscreen | largescreen} -> 40
hint1-mode.overlay.layout-row-count=6 | _{smallscreen} -> 5 | _{mediumscreen | largescreen} -> 4
hint1-mode.overlay.layout-column-count=5 | _{mediumscreen | largescreen} -> 10
hint1-mode.overlay.selection-keys=hint1key | _{mediumscreen | largescreen} -> extendedhint1key
hint1-mode.overlay.font-name=Segoe UI | _{ismacos} -> Helvetica Neue
hint1-mode.overlay.font-size=18 | _{smallscreen} -> 12
hint1-mode.overlay.box-color=#000000
hint1-mode.overlay.prefix-box-enabled=true
hint1-mode.overlay.prefix-in-background=true
hint1-mode.overlay.prefix-font-name=Segoe UI | _{ismacos} -> Helvetica Neue
hint1-mode.overlay.prefix-font-weight=light
hint1-mode.overlay.prefix-font-size=100 | _{smallscreen} -> 80 | _{mediumscreen | largescreen} -> 60
hint1-mode.overlay.prefix-font-color=#FFD93D
hint1-mode.overlay.prefix-font-opacity=0.8
hint1-mode.overlay.prefix-selected-font-color=#CCCCCC
hint1-mode.overlay.prefix-font-shadow-opacity=0
hint1-mode.overlay.selected-font-opacity=0.5
hint1-mode.deselect=+backspace
hint1-mode.save.position-history=+extendedhint1key

hint1-mode.to.hint2-1-mode=+leftctrl
hint2-1-mode.to.hint1-mode=-leftctrl
hint2-1-mode.to.previous-mode-from-history-stack=+leftalt -leftalt | +esc | +backspace
hint2-1-mode.to.hint2-2-mode=+extendedhint1key
hint2-1-mode.hide-cursor=hint1-mode.hide-cursor
hint2-1-mode.overlay=hint1-mode.overlay
hint2-1-mode.deselect=hint1-mode.deselect

hint2-2-mode.to.previous-mode-from-history-stack=+leftalt -leftalt | +esc | +extendedhint2key
hint2-2-mode.break-combo-preparation=+extendedhint2key
hint2-2-mode.to.hint2-1-mode=_{leftctrl} +backspace
hint2-2-mode.to.hint1-mode=^{leftctrl} +backspace
hint2-2-mode.hide-cursor=hint1-mode.hide-cursor
hint2-2-mode.overlay=hint1-mode.overlay
hint2-2-mode.deselect=hint1-mode.deselect
hint2-2-mode.overlay.fade-animation-enabled=false
hint2-2-mode.overlay.area=last-selected-hint-cell
hint2-2-mode.overlay.area-center=last-selected-hint
hint2-2-mode.overlay.area-width-percent=1
hint2-2-mode.overlay.area-height-percent=1
hint2-2-mode.overlay.grid-cell-sizing=fit
hint2-2-mode.overlay.grid-max-row-count=3 | _{smallscreen} -> 3 | _{mediumscreen | largescreen} -> 4
hint2-2-mode.overlay.grid-max-column-count=8 | _{mediumscreen | largescreen} -> 10
hint2-2-mode.overlay.selection-keys=hint2key | _{mediumscreen | largescreen} -> extendedhint2key
hint2-2-mode.overlay.font-size=9 | _{smallscreen | mediumscreen} -> 6 | _{largescreen} -> 8
hint2-2-mode.overlay.box-color=#000000
hint2-2-mode.overlay.prefix-in-background=false
hint2-2-mode.overlay.prefix-box-enabled=false

hint1-mode.to.hint1-then-click-mode=+leftshift
hint1-then-click-mode.to.hint1-mode=-leftshift
hint1-then-click-mode.to.previous-mode-from-history-stack=+leftalt -leftalt | +esc | +backspace
# Click left button when a hint has been selected
hint1-then-click-mode.to.click-after-hint-mode=+extendedhint1key
hint1-then-click-mode.overlay=hint1-mode.overlay
hint1-then-click-mode.deselect=hint1-mode.deselect

click-after-hint-mode=_indicator-mode
click-after-hint-mode.press.left=+hint1key
# Release the click as soon as all hint keys are released.
click-after-hint-mode.release.left=^{hint1key}
# Switch to hold-after-hint-mode after 250ms.
click-after-hint-mode.to.hold-after-hint-mode=#{*}-250
# Reset the wait to be able to double/triple click by tapping the hint key
# multiple times.
click-after-hint-mode.to.click-after-hint-mode=+hint1key
hold-after-hint-mode=_indicator-mode
# Switch to previous mode as soon as all hint keys are released.
hold-after-hint-mode.to.previous-mode-from-history-stack=^{hint1key}

hint2-2-mode.to.hint2-2-then-click-mode=+leftshift
hint2-2-then-click-mode.to.hint2-2-mode=-leftshift
hint2-2-then-click-mode.to.previous-mode-from-history-stack=+esc
hint2-2-then-click-mode.to.hint2-1-mode=^{leftshift} _{leftctrl} +backspace
hint2-2-then-click-mode.to.hint2-2-then-click-mode=_{leftshift} +backspace
hint2-2-then-click-mode.to.hint1-mode=^{leftshift leftctrl} +backspace
# Click left button when a hint has been selected
hint2-2-then-click-mode.to.click-after-hint-mode=+extendedhint2key
hint2-2-then-click-mode.zoom=hint2-2-mode.zoom
hint2-2-then-click-mode.hide-cursor=hint1-mode.hide-cursor
hint2-2-then-click-mode.overlay=hint2-2-mode.overlay
hint2-2-then-click-mode.deselect=hint2-2-mode.deselect


_indicator-mode.indicator.enabled=true
# A click opens a disk the size of the indicator out into a thinning ring that fades away,
# then the ring scales back down. Clicking again during the burst starts it over.
click-burst-animation.duration-millis=500
click-rest-animation.duration-millis=80
_indicator-mode.start.click-burst-animation=+isleftmousepressing | +ismiddlemousepressing | +isrightmousepressing
# Holding the button or moving at the fade mark ends the burst early.
_indicator-mode.stop.click-burst-animation=_{clickburstanimation ismousepressing | clickburstanimation ismoving} wait-250
_indicator-mode.start.click-rest-animation=-clickburstanimation
# The indicator pops in from a dot, past its size and back, when a mode with it is entered
# from idle-mode, and folds into a dot that fades out when idle-mode is entered back, unless a
# click burst is still playing.
virtual-key.indicating=released
_indicator-mode.macro.indicating=^{indicating} #{*}-0 -> #indicating
idle-mode.macro.indicating=_{indicating} #{*}-0 -> ~indicating
pop-in-animation.duration-millis=220
_indicator-mode.start.pop-in-animation=^{indicating} #{*}-0
pop-out-animation.duration-millis=160
idle-mode.start.pop-out-animation=_{indicating} ^{clickburstanimation} #{*}-0
idle-mode.stop.click-rest-animation=_{indicating} #{*}-0
idle-mode.indicator=_indicator-mode.indicator
idle-mode.indicator.enabled=false | _{clickburstanimation} -> true | _{popoutanimation} -> true
_indicator-mode.indicator.size=26 \
  | _{popinanimation} -> 0% 4; 55% 32 exponential-out-4; 100% 26 smootherstep \
  | _{clickrestanimation} -> 0% current; 100% 26 0.7 \
  | _{clickburstanimation} -> 0% 13; 100% 78 exponential-out-10 \
  | _{popoutanimation} -> 0% current; 30% 30 smootherstep; 100% 4 2
_indicator-mode.indicator.follow-mouse=true \
  | _{clickburstanimation} -> false \
  | _{clickburstanimation ismousepressing} -> true
_indicator-mode.indicator.stroke-thickness=1 \
  | _{popinanimation} -> 0% 4; 100% 1 exponential-out-4 \
  | _{clickrestanimation} -> 0% current; 100% 1 0.7 \
  | _{clickburstanimation} -> 0% 13; 100% 0 exponential-out-10 \
  | _{popoutanimation} -> 0% current; 30% current; 100% 4 2
_indicator-mode.indicator.stroke-opacity=1 \
  | _{clickrestanimation} -> 0% current; 100% 1 0.7 \
  | _{clickburstanimation} -> 0% 1; 250ms 1; 500ms 0 0.7 \
  | _{popoutanimation} -> 0% current; 70% current; 100% 0
_indicator-mode.indicator.fill-opacity=0.2 \
  | _{popinanimation} -> 0% 0; 100% 0.2 \
  | _{clickrestanimation} -> 0% current; 100% 0.2 0.7 \
  | _{clickburstanimation} -> 0 \
  | _{popoutanimation} -> 0% current; 100% 0 2
_indicator-mode.indicator.fill-color=#FF0000 \
  | _{iswheeling} -> #FFFF00 \
  | _{clickburstanimation} -> 0% current \
  | _{isleftmousepressing} -> #00FF00 \
  | _{ismiddlemousepressing} -> #FF00FF \
  | _{isrightmousepressing} -> #00FFFF \
  | _{popoutanimation} -> 0% current
_indicator-mode.indicator.stroke-color=#FF0000 \
  | _{iswheeling} -> #FFFF00 \
  | _{clickburstanimation} -> 0% current \
  | _{isleftmousepressing} -> #00FF00 \
  | _{ismiddlemousepressing} -> #FF00FF \
  | _{isrightmousepressing} -> #00FFFF \
  | _{popoutanimation} -> 0% current
_indicator-mode.indicator.shadow-color=#000000 \
  | _{iswheeling} -> #FFFF00 \
  | _{isleftmousepressing} -> #00FF00 \
  | _{ismiddlemousepressing} -> #FF00FF \
  | _{isrightmousepressing} -> #00FFFF
_indicator-mode.indicator.shadow-opacity=0 \
  | _{ismousepressing | iswheeling} ^{clickburstanimation clickrestanimation} -> 1

# Hold f1 to show a cheatsheet of the keys in the middle of the screen.
normal-mode.noop.eatcheatsheet=+cheatsheet
normal-mode.cheatsheet-indicator.enabled=false | _{cheatsheet} -> true
normal-mode.cheatsheet-indicator.follow-mouse=false
normal-mode.cheatsheet-indicator.position=screen-center
normal-mode.cheatsheet-indicator.shape=rectangle
normal-mode.cheatsheet-indicator.text-style-sheet=\
