.title { font-family: 'Segoe UI', 'Helvetica Neue'; font-size: x-large; font-weight: 600; color: #C0CAF5; \
padding-bottom: 8px; border-bottom: 1px solid rgba(122, 162, 247, 0.6); } \
.end { border-bottom: 1px solid rgba(122, 162, 247, 0.6); } \
.section { color: #7AA2F7; padding-right: 20px; } \
.key { color: #E0AF68; padding-right: 28px; }
