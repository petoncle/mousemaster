_indicator-mode.indicator.enabled=true
virtual-key.mouseanimation=released
virtual-key.leftmouseanimation=released
virtual-key.middlemouseanimation=released
virtual-key.rightmouseanimation=released
virtual-key.mouseburst=released
virtual-key.mousefill=released
_indicator-mode.indicator.size=26 | _{mouseburst} -> 2 | _{mouseanimation} ^{mouseburst} -> 44
_indicator-mode.indicator.opacity=0.2 | _{mouseanimation} ^{mouseburst} -> 0
_indicator-mode.indicator.inner-outline-thickness=0.5 | _{mousefill} -> 12.5 | _{mouseburst} ^{mousefill} -> 21.5 | _{mouseanimation} ^{mouseburst} -> 0.1
_indicator-mode.indicator.inner-outline-color=#FF0000 \
  | _{iswheeling} -> #FFFF00 \
  | _{isleftmousepressing | leftmouseanimation} -> #00FF00 \
  | _{ismiddlemousepressing | middlemouseanimation} -> #FF00FF \
  | _{isrightmousepressing | rightmouseanimation} -> #00FFFF
_indicator-mode.indicator.shadow-color=#000000 \
  | _{iswheeling} -> #FFFF00 \
  | _{isleftmousepressing | leftmouseanimation} -> #00FF00 \
  | _{ismiddlemousepressing | middlemouseanimation} -> #FF00FF \
  | _{isrightmousepressing | rightmouseanimation} -> #00FFFF
_indicator-mode.indicator.shadow-opacity=0 | _{mouseburst} -> 1 \
  | _{ismousepressing | iswheeling} ^{mouseanimation} -> 1
_indicator-mode.indicator.color=#FF0000 \
  | _{iswheeling} -> #FFFF00 \
  | _{isleftmousepressing | leftmouseanimation} -> #00FF00 \
  | _{ismiddlemousepressing | middlemouseanimation} -> #FF00FF \
  | _{isrightmousepressing | rightmouseanimation} -> #00FFFF
# A click fills the indicator solid in the button color, expands it to the burst width, opens
# the hole out to the normal outline at that width, holds there, then eases back down.
# Clicking again during the animation starts it over.
_indicator-mode.macro.clickanimation=+isleftmousepressing | +ismiddlemousepressing | +isrightmousepressing -> #mousefill #mouseburst #mouseanimation wait-0 \
  ~mousefill wait-55 ~mouseburst wait-150 wait-100 ~mouseanimation ~leftmouseanimation ~middlemouseanimation ~rightmouseanimation
_indicator-mode.macro.leftclickanimation=+isleftmousepressing -> #leftmouseanimation ~middlemouseanimation ~rightmouseanimation
_indicator-mode.macro.middleclickanimation=+ismiddlemousepressing -> #middlemouseanimation ~leftmouseanimation ~rightmouseanimation
_indicator-mode.macro.rightclickanimation=+isrightmousepressing -> #rightmouseanimation ~leftmouseanimation ~middlemouseanimation
_indicator-mode.indicator.transition-animation-duration-millis=80 | _{mousefill} -> 0 | _{mouseburst} ^{mousefill} -> 55 | _{mouseanimation} ^{mouseburst} -> 150
_indicator-mode.indicator.transition-animation-easing=0.7 | _{mouseburst} ^{mousefill} -> 0.8
_indicator-mode.indicator.transition-animation-switch-at=end \
  | _{ismousepressing | mouseanimation | iswheeling} -> start

key-alias.arrowextramod=leftshift leftctrl leftwin
_arrowremapping-mode.macro.pressarrow=\
  +arrowmod {#*arrowextramod?} +arrowkey | _{arrowmod | arrowmod arrowextramod} +arrowkey \
  -> arrowkey=uparrow downarrow leftarrow rightarrow \
  -> -arrowmod +arrowkey
_arrowremapping-mode.macro.releasearrow=_{arrowmod} -arrowkey \
  -> arrowkey=uparrow downarrow leftarrow rightarrow \
  -> -arrowkey
_arrowremapping-mode.macro.releaseallarrows=_{arrowkey} -arrowmod -> -uparrow -leftarrow -downarrow -rightarrow
key-alias.arrowhandledkey=arrowkey arrowextramod enablekey
_arrowremapping-mode.macro.repressalt=_{arrowmod} ^{arrowkey} #!arrowhandledkey -> +arrowmod

idle-mode.to.begin-alt-tab-mode=_{leftalt} #tab
normal-mode.to.begin-alt-tab-mode=_{leftalt} #tab
# The Alt Tab menu process name is Explorer.EXE.
# We want to center the mouse on the active window as soon as the Alt Tab menu is not
# the active window anymore.
# 1. Wait for the release of leftalt.
begin-alt-tab-mode.to.end-alt-tab-mode=-leftalt
# 2.a Wait for Explorer.EXE to lose focus.
end-alt-tab-mode.to.center-on-active-window-mode=^{Explorer.EXE}
# 2.b Fallback: if Explorer.EXE is still active 200ms after leftalt release, go back.
end-alt-tab-mode.to.previous-mode-from-history-stack=#{*}-200
# 3. Center the mouse on the (newly) active window, then switch back.
center-on-active-window-mode.grid.area=active-window
center-on-active-window-mode.grid.synchronization=mouse-follows-grid-center
# Immediately switch back to previous mode after centering the mouse.
center-on-active-window-mode.to.previous-mode-from-history-stack=wait-0
